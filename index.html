<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOUTUBE DMF</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238b5cf6'/%3E%3Cpath d='M25 18v28l21-14z' fill='white'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:white;font-family:Arial,sans-serif;padding:24px 14px}.app{max-width:900px;margin:auto}h1{text-align:center;font-size:28px}.controls{display:flex;gap:10px;margin:18px 0}input{flex:1;min-width:0;padding:14px;border:0;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:12px 20px;background:#e62117;color:white;font-size:16px;font-weight:bold;cursor:pointer}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}iframe{width:100%;height:100%;border:0}.message{margin-top:15px;padding:12px;border-radius:10px;background:#222;color:#ddd;line-height:1.4}.search{margin-top:28px;padding:18px;border-radius:12px;background:#222}h2{margin:0 0 12px;font-size:21px}.search p{color:#ccc;line-height:1.4}.result{padding:14px 0;border-top:1px solid #444;overflow-wrap:anywhere}.result a{color:#9dbbff}.result button{margin-top:8px;padding:8px 12px;background:#444;font-size:14px}@media(max-width:600px){h1{font-size:23px}.controls{flex-direction:column}button{min-height:48px}}</style>
</head><body><main class="app"><h1>YOUTUBE DMF</h1><section class="search"><h2>🔎 Encuentra un enlace</h2><p>Escribe qué vídeo o canción buscas. Te mostraré enlaces para copiar y pegar abajo.</p><form id="searchForm" class="controls"><input id="query" placeholder="¿Qué quieres buscar?" maxlength="180" required><button>Buscar</button></form><div id="results" aria-live="polite"></div></section><form id="playForm" class="controls"><input id="url" type="text" placeholder="Pega aquí un enlace de YouTube..." autocomplete="off"><button>Reproducir</button></form><div class="player"><iframe id="video" title="Reproductor de YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="message" id="message">Pega un enlace de YouTube para comenzar.</div></main>
<script>
const u=document.getElementById('url'),msg=document.getElementById('message'),out=document.getElementById('results');
function getId(raw){try{const x=new URL(raw);let id=null;if(x.hostname==='youtu.be')id=x.pathname.split('/').filter(Boolean)[0];else if(/(^|\.)youtube(-nocookie)?\.com$/i.test(x.hostname)){if(x.pathname==='/watch')id=x.searchParams.get('v');else id=x.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/)?.[1]}return /^[\w-]{11}$/.test(id||'')?id:null}catch{return null}}
document.getElementById('playForm').addEventListener('submit',e=>{e.preventDefault();const id=getId(u.value.trim());if(!id){msg.textContent='Pega un enlace válido de YouTube.';return}document.getElementById('video').src='https://www.youtube.com/embed/'+id+'?rel=0&playsinline=1';msg.textContent='Vídeo cargado. Algunos vídeos no permiten reproducirse fuera de YouTube.'});
document.getElementById('searchForm').addEventListener('submit',async e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(!q)return;out.textContent='Buscando…';try{const r=await fetch('https://buscador-videos.diego-martinez-3b0.workers.dev/?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo buscar.');out.replaceChildren();if(!data.results.length){out.textContent='No he encontrado resultados. Prueba con otras palabras.';return}data.results.forEach(item=>{const div=document.createElement('div');div.className='result';const title=document.createElement('strong');title.textContent=item.title;const a=document.createElement('a');a.href=item.url;a.textContent=item.url;a.target='_blank';a.rel='noopener noreferrer';const copy=document.createElement('button');copy.type='button';copy.textContent='Copiar enlace';copy.onclick=async()=>{try{await navigator.clipboard.writeText(item.url);copy.textContent='¡Copiado!'}catch{copy.textContent='Selecciona y copia el enlace'}};div.append(title,document.createElement('br'),a,document.createElement('br'),copy);out.append(div)})}catch(error){out.textContent='No se pudo buscar ahora. Inténtalo de nuevo más tarde.'}});
</script></body></html>
