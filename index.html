<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOUTUBE DMF</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='10' width='54' height='44' rx='12' fill='%23d62d38'/%3E%3Cpath d='M26 21v22l18-11z' fill='white'/%3E%3Ccircle cx='51' cy='18' r='3' fill='%23ffd0d4'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111;color:white;font-family:Arial,sans-serif;padding:24px 14px}.app{max-width:900px;margin:auto}h1{text-align:center;font-size:28px}.controls{display:flex;gap:10px;margin:18px 0}input{flex:1;min-width:0;padding:14px;border:0;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:12px 20px;background:#e62117;color:white;font-size:16px;font-weight:bold;cursor:pointer}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}iframe{width:100%;height:100%;border:0}.message{margin-top:15px;padding:12px;border-radius:10px;background:#222;color:#ddd;line-height:1.4}.search{margin-top:28px;padding:18px;border-radius:12px;background:#222}h2{margin:0 0 12px;font-size:21px}.search p{color:#ccc;line-height:1.4}.result{padding:14px 0;border-top:1px solid #444;overflow-wrap:anywhere}.result a{color:#9dbbff}.result button{margin-top:8px;padding:8px 12px;background:#444;font-size:14px}@media(max-width:600px){h1{font-size:23px}.controls{flex-direction:column}button{min-height:48px}}
.urban-card{width:min(100%,380px);margin:32px auto 8px;padding:22px 24px 25px;border-radius:24px;background:linear-gradient(155deg,#3d1119,#191014 57%,#0c0b0d);box-shadow:0 16px 38px #0008;color:#fff;overflow:hidden}
.urban-top,.urban-info{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:1.2px;color:#d5bfc2}.urban-live{color:#ff6470}.urban-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff394d;margin-right:4px;box-shadow:0 0 8px #fc3b4d}
.urban-record{width:min(76%,240px);aspect-ratio:1;margin:25px auto 20px;padding:17%;border-radius:50%;background:repeating-radial-gradient(circle,#1a1013 0 3px,#251317 4px 5px,#100b0d 6px 9px);box-shadow:0 6px 24px #000a,0 0 0 1px #bc384b33;display:grid;place-items:center}.urban-ring{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ff525e,#bf102c 55%,#620a20);display:grid;place-items:center;box-shadow:inset 0 0 0 5px #ffffff1c}.urban-center{width:78%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;border:1px solid #ffb9bf80;color:#fff}.urban-center span{font-size:clamp(13px,4vw,20px);font-weight:900;letter-spacing:-1px}.urban-center strong{font-size:clamp(10px,2.8vw,14px);letter-spacing:2px}
.urban-title{text-align:center}.urban-title h2{font-size:22px;margin:0}.urban-title p{font-size:13px;color:#ccafb4;margin:6px 0 19px}.urban-bar{height:4px;border-radius:4px;background:#5c3037}.urban-bar span{display:block;width:100%;height:100%;border-radius:4px;background:linear-gradient(90deg,#f03549,#731325)}.urban-info{margin-top:10px;font-size:9px;letter-spacing:.5px}.urban-controls{display:flex;justify-content:center;margin:17px 0}.urban-controls button{width:58px;height:58px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;background:#fff;color:#d61631;box-shadow:0 5px 22px #0008}.urban-controls button:hover{background:#ffe5e8}.urban-volume{display:flex;align-items:center;gap:10px;font-size:11px;color:#d5bfc2}.urban-volume input{padding:0;accent-color:#ed344a;cursor:pointer}
</style>
</head><body><main class="app"><h1>YOUTUBE DMF</h1><section class="search"><h2>🔎 Encuentra un enlace</h2><p>Escribe qué vídeo o canción buscas. Te mostraré enlaces para copiar y pegar abajo.</p><form id="searchForm" class="controls"><input id="query" placeholder="¿Qué quieres buscar?" maxlength="180" required><button>Buscar</button></form><div id="results" aria-live="polite"></div></section><form id="playForm" class="controls"><input id="url" type="text" placeholder="Pega aquí un enlace de YouTube..." autocomplete="off"><button>Reproducir</button></form><div class="player"><iframe id="video" title="Reproductor de YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="message" id="message">Pega un enlace de YouTube para comenzar.</div><section class="urban-card" aria-label="Radio LOS40 Urban">
<div class="urban-top"><span>RADIO</span><span class="urban-live"><span class="urban-dot"></span> EN DIRECTO</span></div>
<div class="urban-record" aria-hidden="true"><div class="urban-ring"><div class="urban-center"><span>LOS40</span><strong>URBAN</strong></div></div></div>
<div class="urban-title"><h2>LOS40 Urban</h2><p>El ritmo de la calle</p></div>
<div class="urban-bar"><span></span></div>
<div class="urban-info"><span>RADIO EN DIRECTO</span><span id="radioStatus" aria-live="polite">Lista para escuchar</span></div>
<div class="urban-controls"><button id="radioToggle" type="button" aria-label="Reproducir radio" title="Reproducir radio"><svg id="radioIcon" viewBox="0 0 24 24" width="27" height="27" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg></button></div>
<div class="urban-volume"><label for="radioVolume">Volumen</label><input id="radioVolume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volumen de la radio"></div>
<audio id="radioUrban" preload="none" src="https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40_URBAN_SC.mp3"></audio>
</section></main>
<script>
const u=document.getElementById('url'),msg=document.getElementById('message'),out=document.getElementById('results');
function getId(raw){try{const x=new URL(raw);let id=null;if(x.hostname==='youtu.be')id=x.pathname.split('/').filter(Boolean)[0];else if(/(^|\.)youtube(-nocookie)?\.com$/i.test(x.hostname)){if(x.pathname==='/watch')id=x.searchParams.get('v');else id=x.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/)?.[1]}return /^[\w-]{11}$/.test(id||'')?id:null}catch{return null}}
document.getElementById('playForm').addEventListener('submit',e=>{e.preventDefault();const id=getId(u.value.trim());if(!id){msg.textContent='Pega un enlace válido de YouTube.';return}document.getElementById('radioUrban').pause();document.getElementById('video').src='https://www.youtube.com/embed/'+id+'?rel=0&playsinline=1';msg.textContent='Vídeo cargado. Algunos vídeos no permiten reproducirse fuera de YouTube.'});
document.getElementById('searchForm').addEventListener('submit',async e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(!q)return;out.textContent='Buscando…';try{const r=await fetch('https://buscador-videos.diego-martinez-3b0.workers.dev/?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudo buscar.');out.replaceChildren();if(!data.results.length){out.textContent='No he encontrado resultados. Prueba con otras palabras.';return}data.results.forEach(item=>{const div=document.createElement('div');div.className='result';const title=document.createElement('strong');title.textContent=item.title;const a=document.createElement('a');a.href=item.url;a.textContent=item.url;a.target='_blank';a.rel='noopener noreferrer';const copy=document.createElement('button');copy.type='button';copy.textContent='Copiar enlace';copy.onclick=async()=>{try{await navigator.clipboard.writeText(item.url);copy.textContent='¡Copiado!'}catch{copy.textContent='Selecciona y copia el enlace'}};div.append(title,document.createElement('br'),a,document.createElement('br'),copy);out.append(div)})}catch(error){out.textContent='No se pudo buscar ahora. Inténtalo de nuevo más tarde.'}});

const radioUrban=document.getElementById('radioUrban'),radioToggle=document.getElementById('radioToggle'),radioIcon=document.getElementById('radioIcon'),radioStatus=document.getElementById('radioStatus'),radioVolume=document.getElementById('radioVolume');
radioUrban.volume=Number(radioVolume.value);radioVolume.addEventListener('input',()=>radioUrban.volume=Number(radioVolume.value));
radioToggle.addEventListener('click',async()=>{if(!radioUrban.paused){radioUrban.pause();return}radioStatus.textContent='Conectando…';try{await radioUrban.play()}catch{radioStatus.textContent='No se ha podido conectar';}});
radioUrban.addEventListener('playing',()=>{radioStatus.textContent='Sonando';radioToggle.setAttribute('aria-label','Pausar radio');radioToggle.title='Pausar radio';radioIcon.innerHTML='<path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor"/>'});
radioUrban.addEventListener('pause',()=>{radioStatus.textContent='En pausa';radioToggle.setAttribute('aria-label','Reproducir radio');radioToggle.title='Reproducir radio';radioIcon.innerHTML='<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>'});
radioUrban.addEventListener('waiting',()=>radioStatus.textContent='Conectando…');radioUrban.addEventListener('error',()=>radioStatus.textContent='No se ha podido conectar');
</script></body></html>
