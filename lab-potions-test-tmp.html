<!doctype html><meta charset="utf-8"><h1>Prueba aislada de las cinco pociones</h1><button id="run">Probar cinco pociones</button><pre id="result"></pre><iframe id="frame" width="800" height="520"></iframe><script>
const frame=document.querySelector('#frame'),out=document.querySelector('#result');function log(x){out.textContent+=x+'\n'}
function open(){return new Promise(r=>{frame.onload=()=>r(frame.contentWindow);frame.src='lab-animation-probe-tmp.html?'+Math.random()})}
document.querySelector('#run').onclick=async()=>{out.textContent='';try{for(let n=0;n<5;n++){let w=await open(),d=w.document,a=d.querySelector('#voice'),count=0,states=[];const proto=w.AudioContext.prototype,orig=proto.createOscillator;proto.createOscillator=function(...p){count++;states.push(this.state);return orig.apply(this,p)};d.querySelector('#start').click();await new Promise(r=>setTimeout(r,400));a.currentTime=9;a.dispatchEvent(new w.Event('timeupdate'));let bs=d.querySelectorAll('#choiceButtons [data-color]');if(bs.length!==5)throw Error('Choices found '+bs.length);let color=bs[n].dataset.color;bs[n].click();if(!d.querySelector('#pickedText').textContent.includes('poción'))throw Error('Choice failed '+color);a.currentTime=12.2;a.dispatchEvent(new w.Event('timeupdate'));if(!d.querySelector('#s6').classList.contains('active'))throw Error('Pour missing '+color);a.currentTime=24.2;a.dispatchEvent(new w.Event('timeupdate'));if(!d.querySelector('#s9').classList.contains('active'))throw Error('Explosion missing '+color);log('PASS '+color+' pour and explosion; oscillator calls='+count+', context='+states.join(','));}log('ALL FIVE DONE')}catch(e){log('FAIL '+e.message)}};
</script>
