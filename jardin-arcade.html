<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arcade DMF</title><style>*{box-sizing:border-box}body{background:linear-gradient(150deg,#10213c,#244c54);font-family:system-ui,sans-serif;color:white;text-align:center;margin:0;padding:10px}h2{margin:8px}p{margin:8px auto;max-width:720px}canvas{display:block;width:min(100%,760px);height:auto;margin:12px auto;background:#89c8f3;border:3px solid #def4ff;border-radius:16px;touch-action:none}button{font-size:16px;font-weight:bold;border:0;border-radius:10px;background:#ffd15e;color:#23314a;padding:12px 18px;margin:4px;cursor:pointer}.note{color:#d0e7f2;font-size:13px}</style></head><body><h2 id="heading"></h2><p id="info"></p><canvas id="game" width="760" height="430" aria-label="Juego de arcade"></canvas><div><button id="action"></button><button id="reset">Reiniciar</button></div><p class="note">Juego inspirado en un Doodle; no es el original de Google.</p><script>
const c=document.getElementById('game'),x=c.getContext('2d'),heading=document.getElementById('heading'),info=document.getElementById('info'),btn=document.getElementById('action');const mode=new URLSearchParams(location.search).get('game');let sim=null,last=0;
function ellipse(a,b,rx,ry,color){x.fillStyle=color;x.beginPath();x.ellipse(a,b,rx,ry,0,0,Math.PI*2);x.fill()}function sky(){let gr=x.createLinearGradient(0,0,0,430);gr.addColorStop(0,'#6fb9ec');gr.addColorStop(1,'#eaf6d0');x.fillStyle=gr;x.fillRect(0,0,760,430);ellipse(640,65,30,30,'#ffe27b');for(let i=0;i<3;i++){ellipse(90+i*255,65+(i%2)*30,50,16,'#ffffffb8');ellipse(75+i*255,57+(i%2)*30,25,18,'#ffffffb8')}}
function initGnome(){heading.textContent='🌻 Enanos del jardín';btn.textContent='Lanzar / impulsar';info.textContent='Pulsa lanzar cuando la barra esté alta. Pulsa otra vez en el aire para impulsarte una vez.';sim={state:'ready',power:0,dir:1,t:0,gx:110,gy:328,vx:0,vy:0,distance:0,best:0,boost:true,flowers:[]}}
function gnomeAction(){let s=sim;if(s.state==='ready'){s.state='flying';s.vx=4+s.power*0.09;s.vy=-(6+s.power*.09)}else if(s.state==='flying'&&s.boost){s.vy-=5;s.vx+=1.8;s.boost=false}else if(s.state==='done'){let best=s.best;initGnome();sim.best=best}}
function gnomeDraw(dt){let s=sim;sky();x.fillStyle='#87c85e';x.fillRect(0,355,760,75);x.fillStyle='#4a994d';x.fillRect(0,382,760,48);for(let i=0;i<16;i++){let xx=(i*90-(s.distance%90)+760)%760;ellipse(xx,363,5,5,i%2?'#ffd755':'#fa8da8');x.fillStyle='#529b45';x.fillRect(xx-1,365,2,13)}x.fillStyle='#754629';x.fillRect(45,306,85,12);x.save();x.translate(91,312);x.rotate(-.45);x.fillStyle='#995e35';x.fillRect(-9,-48,16,84);x.restore();if(s.state==='ready'){s.power+=s.dir*1.5*dt;if(s.power>100||s.power<0){s.power=Math.max(0,Math.min(100,s.power));s.dir*=-1}x.fillStyle='#223948';x.fillRect(20,18,210,25);x.fillStyle='#ffcc4a';x.fillRect(25,23,s.power*2,15)}if(s.state==='flying'){s.vy+=.14*dt;s.distance+=s.vx*dt;s.gx=Math.min(420,s.gx+s.vx*dt*.55);s.gy+=s.vy*dt;if(s.gy>340){s.gy=340;s.state='done';s.best=Math.max(s.best,Math.floor(s.distance));info.textContent='¡Has llegado a '+Math.floor(s.distance)+' metros! Pulsa lanzar para volver a jugar.'}}x.save();x.translate(s.gx,s.gy);ellipse(0,0,18,17,'#325b9a');ellipse(0,-17,13,13,'#f5c598');x.fillStyle='#faf5e5';x.beginPath();x.moveTo(-12,-13);x.lineTo(0,10);x.lineTo(12,-13);x.fill();x.fillStyle='#d94442';x.beginPath();x.moveTo(-13,-23);x.lineTo(0,-48);x.lineTo(13,-23);x.closePath();x.fill();x.restore();x.fillStyle='#243d36';x.font='bold 21px system-ui';x.fillText(Math.floor(s.distance)+' m',585,32);x.font='15px system-ui';x.fillText('Récord: '+s.best+' m',585,54)}
function initPop(){heading.textContent='🍿 Palomitas';btn.textContent='Empezar';info.textContent='Muévete con el dedo, ratón o flechas y esquiva los granos calientes. ¡Aguanta todo lo que puedas!';sim={state:'ready',px:380,py:330,time:0,spawn:0,obstacles:[],keys:{},best:0}}
function popcornAction(){if(sim.state==='ready'){sim.state='playing';btn.textContent='Nueva partida'}else{let best=sim.best;initPop();sim.best=best}}
function popcornDraw(dt){let s=sim;let gr=x.createLinearGradient(0,0,0,430);gr.addColorStop(0,'#4a2c5b');gr.addColorStop(1,'#bd6c60');x.fillStyle=gr;x.fillRect(0,0,760,430);x.fillStyle='#f7b06b';x.fillRect(0,400,760,30);if(s.state==='playing'){s.time+=dt/60;s.spawn-=dt;if(s.keys.ArrowLeft)s.px-=6*dt;if(s.keys.ArrowRight)s.px+=6*dt;if(s.keys.ArrowUp)s.py-=6*dt;if(s.keys.ArrowDown)s.py+=6*dt;s.px=Math.max(22,Math.min(738,s.px));s.py=Math.max(25,Math.min(385,s.py));if(s.spawn<=0){s.obstacles.push({x:20+Math.random()*720,y:-30,v:2.3+Math.random()*2+s.time*.025});s.spawn=Math.max(8,25-s.time*.25)}for(let o of s.obstacles){o.y+=o.v*dt;if(Math.hypot(o.x-s.px,o.y-s.py)<24){s.state='done';s.best=Math.max(s.best,Math.floor(s.time));info.textContent='¡Te han pillado! Has aguantado '+Math.floor(s.time)+' segundos.';btn.textContent='Nueva partida'}}s.obstacles=s.obstacles.filter(o=>o.y<450)}for(let o of s.obstacles){ellipse(o.x,o.y,12,16,'#ef694b');ellipse(o.x-3,o.y-3,4,6,'#ffd590')}ellipse(s.px,s.py,19,17,'#fff1b5');for(let q of [[-12,-12],[0,-18],[13,-11]])ellipse(s.px+q[0],s.py+q[1],11,10,'#fff5ce');ellipse(s.px-6,s.py,2,3,'#523e35');ellipse(s.px+6,s.py,2,3,'#523e35');x.fillStyle='white';x.font='bold 20px system-ui';x.fillText('Tiempo: '+Math.floor(s.time)+' s',16,28);x.fillText('Récord: '+s.best+' s',585,28)}
function loop(t){let dt=Math.min(2,(t-(last||t))/16.67);last=t;if(mode==='gnomes')gnomeDraw(dt);else popcornDraw(dt);requestAnimationFrame(loop)}function pointer(e){if(mode!=='popcorn'||sim.state!=='playing')return;const r=c.getBoundingClientRect();sim.px=(e.clientX-r.left)*760/r.width;sim.py=(e.clientY-r.top)*430/r.height}c.addEventListener('pointerdown',e=>{if(mode==='gnomes')gnomeAction();else if(sim.state==='ready')popcornAction();else pointer(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)pointer(e)});btn.onclick=()=>mode==='gnomes'?gnomeAction():popcornAction();document.getElementById('reset').onclick=()=>mode==='gnomes'?initGnome():initPop();window.addEventListener('keydown',e=>{if(mode==='popcorn'&&e.key.startsWith('Arrow')){e.preventDefault();sim.keys[e.key]=true}else if(e.code==='Space'){e.preventDefault();mode==='gnomes'?gnomeAction():sim.state==='ready'&&popcornAction()}});window.addEventListener('keyup',e=>{if(mode==='popcorn')sim.keys[e.key]=false});mode==='gnomes'?initGnome():initPop();requestAnimationFrame(loop);
</script></body></html>
