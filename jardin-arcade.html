<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arcade DMF</title><style>*{box-sizing:border-box}body{background:linear-gradient(150deg,#10213c,#244c54);font-family:system-ui,sans-serif;color:white;text-align:center;margin:0}h2{margin:8px}p{margin:8px auto;max-width:720px}canvas{display:block;width:min(100%,760px);height:auto;margin:12px auto;background:#89c8f3;border:3px solid #def4ff;border-radius:16px;touch-action:none}button{font-size:16px;font-weight:bold;border:0;border-radius:10px;background:#ffd15e;color:#23314a;padding:12px 18px;margin:4px;cursor:pointer}.note{color:#d0e7f2;font-size:13px}
/* Center the whole game when it fits; keep normal scrolling when it does not. */
body{min-height:100vh;display:flex;flex-direction:column}
.arcade-stage{width:100%;margin:auto 0;padding:10px;flex:none}
</style></head><body><main class="arcade-stage"><h2 id="heading"></h2><p id="info"></p><canvas id="game" width="760" height="430" aria-label="Juego de arcade"></canvas><div><button id="action"></button><button id="reset">Reiniciar</button></div><p class="note">Juego inspirado en un Doodle; no es el original de Google.</p></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),heading=document.getElementById('heading'),info=document.getElementById('info'),btn=document.getElementById('action');const mode=new URLSearchParams(location.search).get('game');let sim=null,last=0;
function ellipse(a,b,rx,ry,color){x.fillStyle=color;x.beginPath();x.ellipse(a,b,rx,ry,0,0,Math.PI*2);x.fill()}function sky(){let gr=x.createLinearGradient(0,0,0,430);gr.addColorStop(0,'#6fb9ec');gr.addColorStop(1,'#eaf6d0');x.fillStyle=gr;x.fillRect(0,0,760,430);ellipse(640,65,30,30,'#ffe27b');for(let i=0;i<3;i++){ellipse(90+i*255,65+(i%2)*30,50,16,'#ffffffb8');ellipse(75+i*255,57+(i%2)*30,25,18,'#ffffffb8')}}
function initGnome(){heading.textContent='🌻 Lanzamiento de enanos';btn.textContent='Lanzar enano';info.textContent='Pulsa para lanzar. Los troncos y las mariposas te impulsan; también puedes usar un impulso en el aire.';sim={state:'ready',power:0,dir:1,t:0,worldX:0,gy:333,vx:0,vy:0,bounces:0,distance:0,best:0,boost:true,particles:[],used:{},flash:0}}
function gnomeAction(){let s=sim;if(s.state==='ready'){s.state='flying';s.vx=6+s.power*.12;s.vy=-(9+s.power*.09);btn.textContent='Impulsar';info.textContent='¡Vuela! Pulsa una vez para impulsarte.'}else if(s.state==='flying'&&s.boost){s.vy-=6;s.vx+=2.5;s.boost=false;btn.textContent='Impulso usado';for(let i=0;i<14;i++)s.particles.push({wx:s.worldX,y:s.gy,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:35})}else if(s.state==='done'){let best=s.best;initGnome();sim.best=best}}
function gnomeDraw(dt){let s=sim;sky();let cam=Math.max(0,s.worldX-230);x.fillStyle='#aed77b';x.beginPath();x.moveTo(0,345);for(let i=0;i<=760;i+=20)x.lineTo(i,330+20*Math.sin((i+cam*.25)/135));x.lineTo(760,430);x.lineTo(0,430);x.fill();x.fillStyle='#74b95c';x.fillRect(0,355,760,75);x.fillStyle='#4a984b';x.fillRect(0,395,760,35);for(let n=Math.floor(cam/100)-1;n<Math.ceil((cam+760)/100)+1;n++){let xx=n*100-cam+40;if(xx<0||xx>760)continue;x.strokeStyle='#38833f';x.lineWidth=3;x.beginPath();x.moveTo(xx,397);x.lineTo(xx,371);x.stroke();for(let k=0;k<5;k++){let a=k*Math.PI*2/5;ellipse(xx+Math.cos(a)*5,369+Math.sin(a)*5,4,4,n%2?'#ffdd5a':'#ff9abb')}ellipse(xx,369,3,3,'#fff6aa')}if(cam<150){let bx=80-cam;x.fillStyle='#714326';x.fillRect(bx-33,337,80,12);x.beginPath();x.moveTo(bx-12,337);x.lineTo(bx+3,285);x.lineTo(bx+24,337);x.closePath();x.fill();x.save();x.translate(bx+3,290);x.rotate(-.55);x.fillStyle='#99613a';x.fillRect(-8,-55,14,100);x.restore();ellipse(bx+3,290,6,6,'#d8a151')}if(s.state==='ready'){s.power+=s.dir*1.2*dt;if(s.power>100||s.power<0){s.power=Math.max(0,Math.min(100,s.power));s.dir*=-1}x.fillStyle='#213e4c';x.fillRect(20,18,220,25);let g=x.createLinearGradient(25,0,225,0);g.addColorStop(0,'#9cdd59');g.addColorStop(1,'#fc7554');x.fillStyle=g;x.fillRect(25,23,s.power*2.1,15);x.fillStyle='white';x.font='bold 13px system-ui';x.fillText('FUERZA',25,59)}for(let k=Math.max(0,Math.floor((cam-400)/600));k<Math.ceil((cam+900)/600);k++){let wx=280+k*600,xx=wx-cam+110,used=s.used['log'+k];if(xx>-40&&xx<800&&!used){x.save();x.translate(xx,344);x.rotate(-.12);x.fillStyle='#805026';x.beginPath();x.roundRect(-25,-10,50,20,8);x.fill();ellipse(-25,0,8,10,'#c78b50');ellipse(-25,0,4,6,'#956334');x.restore()}}for(let k=Math.max(0,Math.floor((cam-400)/300));k<Math.ceil((cam+900)/300);k++){let bwx=430+k*300,bx=bwx-cam+110,by=220+(k%3)*42+Math.sin(Date.now()/500+k)*9;if(bx>-40&&bx<800&&!s.used['butterfly'+k]){ellipse(bx-7,by,8,11,'#ffb5e6');ellipse(bx+7,by,8,11,'#ffc75f');ellipse(bx,by,2.5,9,'#43375c')}}if(s.flash>0){s.flash-=dt;x.fillStyle='#fff7a4';x.font='bold 18px system-ui';x.fillText('¡IMPULSO!',320,72)}if(s.state==='flying'){let prev=s.worldX;s.vy+=.21*dt;s.worldX+=s.vx*dt;s.gy+=s.vy*dt;s.vx*=Math.pow(.999,dt);s.distance=Math.max(0,Math.floor(s.worldX));for(let k=Math.max(0,Math.floor((prev-500)/600));k<Math.ceil((s.worldX+100)/600);k++){let wx=280+k*600;if(!s.used['log'+k]&&prev<=wx+30&&s.worldX>=wx-30&&s.gy>305&&s.vy>0){s.used['log'+k]=true;s.gy=305;s.vy=-Math.max(7,Math.abs(s.vy)*.95);s.vx+=2;s.bounces=0;s.flash=65;info.textContent='¡El tronco te ha impulsado!'}}for(let k=Math.max(0,Math.floor((prev-500)/300));k<Math.ceil((s.worldX+100)/300);k++){let bwx=430+k*300,by=220+(k%3)*42+Math.sin(Date.now()/500+k)*9;if(!s.used['butterfly'+k]&&prev<=bwx+24&&s.worldX>=bwx-24&&Math.abs(s.gy-by)<36){s.used['butterfly'+k]=true;s.vy-=5;s.vx+=2;s.flash=65;info.textContent='¡La mariposa te ha impulsado!'}}if(s.gy>=342){s.gy=342;s.bounces++;if(Math.abs(s.vy)>2&&s.bounces<5){s.vy=-Math.abs(s.vy)*.55;s.vx*=.77;for(let i=0;i<9;i++)s.particles.push({wx:s.worldX,y:350,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:24})}else{s.state='done';s.best=Math.max(s.best,s.distance);btn.textContent='Jugar otra vez';info.textContent='¡Has llegado a '+s.distance+' metros! Lanza de nuevo para superar tu récord.'}}}for(let particle of s.particles){particle.wx+=particle.vx*dt;particle.y+=particle.vy*dt;particle.vy+=.1*dt;particle.life-=dt;ellipse(particle.wx-cam+110,particle.y,3,3,'#fff1b0')}s.particles=s.particles.filter(p=>p.life>0);let gx=s.worldX-cam+110;x.save();x.translate(gx,s.gy);if(s.state==='flying')x.rotate(Math.min(.8,s.vy*.04));ellipse(0,3,19,16,'#285a9b');ellipse(-9,15,8,5,'#764a32');ellipse(9,15,8,5,'#764a32');ellipse(0,-17,13,13,'#f5c598');x.fillStyle='#fff8ed';x.beginPath();x.moveTo(-13,-13);x.lineTo(0,12);x.lineTo(13,-13);x.fill();ellipse(-4,-17,2,2,'#332b29');ellipse(5,-17,2,2,'#332b29');ellipse(0,-12,4,3,'#e99781');x.fillStyle='#dd4145';x.beginPath();x.moveTo(-15,-23);x.lineTo(-2,-53);x.lineTo(15,-23);x.closePath();x.fill();ellipse(-2,-52,3,3,'#f2f0d9');x.restore();x.fillStyle='#173b31';x.font='bold 22px system-ui';x.fillText(s.distance+' m',570,30);x.font='bold 15px system-ui';x.fillText('Récord: '+s.best+' m',570,52)}

function initPop(){heading.textContent='🍿 Fiesta de palomitas';btn.textContent='Empezar';info.textContent='Esquiva las bolas calientes, recoge estrellas y aguanta. Muévete con el dedo, el ratón o las flechas.';sim={state:'ready',px:380,py:335,time:0,spawn:0,stars:[],starTimer:90,obstacles:[],keys:{},best:0,score:0,lives:3,invincible:0,particles:[]}}
function popcornAction(){if(sim.state==='ready'){sim.state='playing';btn.textContent='Nueva partida';info.textContent='¡Esquiva y recoge estrellas!'}else{let best=sim.best;initPop();sim.best=best}}
function popcornDraw(dt){let s=sim;let gr=x.createLinearGradient(0,0,0,430);gr.addColorStop(0,'#282356');gr.addColorStop(.6,'#7e4d80');gr.addColorStop(1,'#f8a85d');x.fillStyle=gr;x.fillRect(0,0,760,430);for(let i=0;i<28;i++){let xx=(i*193)%760,yy=(i*83)%250;ellipse(xx,yy,1.5,1.5,'#fff9b0')}x.fillStyle='#442c56';x.fillRect(0,395,760,35);for(let i=0;i<16;i++){x.fillStyle=i%2?'#e65c54':'#ffd574';x.fillRect(i*50,405,50,25)}if(s.state==='playing'){s.time+=dt/60;s.invincible=Math.max(0,s.invincible-dt);s.spawn-=dt;s.starTimer-=dt;if(s.keys.ArrowLeft)s.px-=6*dt;if(s.keys.ArrowRight)s.px+=6*dt;if(s.keys.ArrowUp)s.py-=6*dt;if(s.keys.ArrowDown)s.py+=6*dt;s.px=Math.max(24,Math.min(736,s.px));s.py=Math.max(30,Math.min(375,s.py));if(s.spawn<=0){s.obstacles.push({x:25+Math.random()*710,y:-30,v:2.2+Math.random()*2+s.time*.025,spin:Math.random()*6});s.spawn=Math.max(9,30-s.time*.3)}if(s.starTimer<=0){s.stars.push({x:35+Math.random()*690,y:-20,v:2});s.starTimer=130}for(let o of s.obstacles){o.y+=o.v*dt;o.spin+=.05*dt;if(!s.invincible&&Math.hypot(o.x-s.px,o.y-s.py)<24){s.lives--;s.invincible=100;o.y=500;for(let k=0;k<12;k++)s.particles.push({x:s.px,y:s.py,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:30});if(s.lives<=0){s.state='done';s.best=Math.max(s.best,Math.floor(s.score));info.textContent='¡Fin! Puntos: '+Math.floor(s.score)+'. Pulsa Nueva partida para volver a jugar.';btn.textContent='Nueva partida'}}}for(let star of s.stars){star.y+=star.v*dt;if(Math.hypot(star.x-s.px,star.y-s.py)<25){star.y=500;s.score+=50;for(let k=0;k<10;k++)s.particles.push({x:s.px,y:s.py,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:25})}}s.score+=dt*.08;s.obstacles=s.obstacles.filter(o=>o.y<460);s.stars=s.stars.filter(o=>o.y<460)}for(let star of s.stars){x.font='bold 26px system-ui';x.fillText('⭐',star.x-13,star.y+9)}for(let o of s.obstacles){x.save();x.translate(o.x,o.y);x.rotate(o.spin);ellipse(0,0,13,16,'#f26648');ellipse(-4,-4,5,7,'#ffd184');x.restore()}for(let particle of s.particles){particle.x+=particle.vx*dt;particle.y+=particle.vy*dt;particle.life-=dt;ellipse(particle.x,particle.y,3,3,'#ffe488')}s.particles=s.particles.filter(p=>p.life>0);if(!s.invincible||Math.floor(s.invincible/8)%2===0){ellipse(s.px,s.py+5,19,16,'#ffe095');for(let q of [[-13,-8],[-5,-16],[8,-17],[15,-8]])ellipse(s.px+q[0],s.py+q[1],11,10,'#fff6d8');ellipse(s.px-6,s.py,2.5,3,'#453a3c');ellipse(s.px+6,s.py,2.5,3,'#453a3c');x.strokeStyle='#ba6d50';x.lineWidth=2;x.beginPath();x.arc(s.px,s.py+4,5,.2,Math.PI-.2);x.stroke()}x.fillStyle='white';x.font='bold 20px system-ui';x.fillText('⭐ '+Math.floor(s.score),16,28);x.fillText('❤️ '.repeat(Math.max(0,s.lives)),300,28);x.font='bold 16px system-ui';x.fillText('⏱ '+Math.floor(s.time)+' s',650,28);if(s.state==='ready'){x.fillStyle='#ffffffde';x.font='bold 24px system-ui';x.fillText('¡Sobrevive y recoge estrellas!',205,135)}}

function loop(t){let dt=Math.min(2,(t-(last||t))/16.67);last=t;if(mode==='gnomes')gnomeDraw(dt);else popcornDraw(dt);requestAnimationFrame(loop)}function pointer(e){if(mode!=='popcorn'||sim.state!=='playing')return;const r=c.getBoundingClientRect();sim.px=(e.clientX-r.left)*760/r.width;sim.py=(e.clientY-r.top)*430/r.height}c.addEventListener('pointerdown',e=>{if(mode==='gnomes')gnomeAction();else if(sim.state==='ready')popcornAction();else pointer(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)pointer(e)});btn.onclick=()=>mode==='gnomes'?gnomeAction():popcornAction();document.getElementById('reset').onclick=()=>mode==='gnomes'?initGnome():initPop();window.addEventListener('keydown',e=>{if(mode==='popcorn'&&e.key.startsWith('Arrow')){e.preventDefault();sim.keys[e.key]=true}else if(e.code==='Space'){e.preventDefault();mode==='gnomes'?gnomeAction():sim.state==='ready'&&popcornAction()}});window.addEventListener('keyup',e=>{if(mode==='popcorn')sim.keys[e.key]=false});mode==='gnomes'?initGnome():initPop();requestAnimationFrame(loop);
</script></body></html>
