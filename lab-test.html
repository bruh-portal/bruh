<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio test</title><style>body{font:16px sans-serif;background:#163748;color:white;margin:12px}button{font-size:16px;padding:9px}article{background:#18465a;padding:12px;border-radius:8px}canvas{max-width:100%}</style><script>const RealDate=Date;const q=new URLSearchParams(location.search);const fixed=q.get('date');if(fixed){window.Date=class extends RealDate{constructor(...a){super(...(a.length?a:[fixed]))}static now(){return +new RealDate(fixed)}}}</script><div id="panel-browser"><section id="discoverRoot"></section></div><script>(()=>{
'use strict';
const root=document.getElementById('discoverRoot');if(!root)return;
let state={slot:null,ids:[]};
root.innerHTML=`<h2>🧪 Laboratorio</h2><p>Una misión de juego con tres intentos. El nivel y el objetivo aparecen en la tarjeta.</p><p>Una misión nueva a las 08:00, 11:00, 14:00, 17:00 y 20:00, según el reloj de este dispositivo. La anterior desaparece al cambiar. La de las 20:00 dura toda la noche hasta las 08:00.</p><p id="discoverClock" role="status"></p><div id="labIntro" hidden aria-label="Animación decorativa del laboratorio"><p>Elige una poción para la animación. El color es decorativo y no cambia las actividades.</p><div class="lab-stage" aria-hidden="true"><svg viewBox="0 0 400 150" role="presentation"><rect width="400" height="150" rx="14" fill="#153c52"/><path d="M0 109h400v41H0z" fill="#76504d"/><path d="M0 110h400v10H0z" fill="#bd8b6a"/><g fill="#90e4ed" opacity=".55"><circle cx="105" cy="15" r="2"/><circle cx="267" cy="33" r="3"/><circle cx="280" cy="13" r="2"/><circle cx="97" cy="74" r="2"/></g><path d="M17 84h66v5H17zM18 78h12v6H18zM35 72h10v12H35zM51 77h13v7H51z" fill="#f8d58d"/><path d="M334 76h38v5h-38z M338 60h9v16h-9z M354 65h11v11h-11z" fill="#efb784"/><path d="M0 109h400" stroke="#f2c188" stroke-width="5"/><circle cx="63" cy="39" r="24" fill="#a4edf1" stroke="#86cbd3" stroke-width="4"/><path d="M39 39h48M63 15v48" stroke="#5395a6" stroke-width="3"/><path d="M315 19h58v49h-58z" fill="#597481"/><path d="M321 25h46v36h-46z" fill="#c5d8b0"/><path d="M327 51l10-14 9 10 12-16" fill="none" stroke="#6c9d82" stroke-width="3"/><g class="lab-bottle"><path d="M124 26h23v15l9 11-13 22-30-17 9-16z" fill="#bdeffa" stroke="#ecffff" stroke-width="3"/><path d="M117 54l27 15 8-13-27-15z" fill="var(--lab-color,#a65bdb)"/><path d="M123 26h27" stroke="#ffd77e" stroke-width="7" stroke-linecap="round"/></g><path class="lab-drop" d="M168 52q-6 9 0 12t0-12z" fill="var(--lab-color,#e689ff)"/><path d="M191 64h24v24l20 22q5 7-5 8h-54q-10-1-5-8l20-22z" fill="#dffcff" stroke="#fff" stroke-width="3"/><path d="M182 104q21-8 42 0l7 10h-56z" fill="#48d6b5"/><circle cx="196" cy="104" r="2" fill="#276679"/><circle cx="211" cy="104" r="2" fill="#276679"/><path d="M198 110q5 4 10 0" fill="none" stroke="#276679" stroke-width="2"/><g class="lab-burst" fill="#ffe66d"><path d="M202 29l5 13 12-6-6 12 13 5-13 5 6 12-12-6-5 13-5-13-12 6 6-12-13-5 13-5-6-12 12 6z"/><circle cx="168" cy="31" r="4"/><circle cx="242" cy="68" r="4"/><circle cx="240" cy="27" r="3"/></g></svg></div><div id="labChoices" aria-label="Elige una de cinco pociones"></div><button type="button" id="labSkip">Saltar y ver actividades</button></div><div id="discoverCards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px"></div><p class="discover-note" id="discoverInfo"></p>`;
const $=id=>document.getElementById(id), key='dmf_lab_test_mission_v1';
const labStyle=document.createElement('style');labStyle.textContent=`#labIntro{background:#0d2b3b;border:1px solid #65cfd1;border-radius:14px;padding:8px 14px;margin:12px 0;text-align:center}#labIntro[hidden],#discoverCards[hidden]{display:none!important}.lab-stage{max-width:400px;margin:auto}.lab-stage svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 14px #00131c);animation:labEnter 1.4s ease-out both}.lab-stage{overflow:hidden;border-radius:14px;background:#153c52}@keyframes labEnter{from{transform:scale(1.55);opacity:.2}to{transform:scale(1);opacity:1}}.lab-bottle{transform-origin:137px 46px;animation:labFloat 2.4s ease-in-out infinite}@keyframes labFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.lab-drop,.lab-burst{opacity:0}.lab-burst{transform-origin:202px 53px}#labIntro.playing .lab-bottle{animation:labTilt 1.2s ease-in-out}#labIntro.playing .lab-drop{animation:labPour 1s .5s ease-in forwards}#labIntro.playing .lab-burst{animation:labBoom .8s 1.3s ease-out forwards}@keyframes labTilt{0%,100%{transform:rotate(0)}45%,75%{transform:rotate(35deg)}}@keyframes labPour{0%{transform:translate(0,0);opacity:1}90%{opacity:1}100%{transform:translate(31px,38px);opacity:0}}@keyframes labBoom{0%{opacity:1;transform:scale(.2)}70%{opacity:1}100%{opacity:0;transform:scale(2)}}@media(prefers-reduced-motion:reduce){.lab-stage svg,.lab-bottle,.lab-drop,.lab-burst{animation:none}.lab-drop,.lab-burst{display:none}}`;document.head.append(labStyle);
let introSeen=null,introTimer=null;try{introSeen=localStorage.getItem('dmf_lab_test_intro_v1')}catch(e){}
function endIntro(){clearTimeout(introTimer);$('labIntro').hidden=true;$('labIntro').classList.remove('playing');$('labChoices').hidden=false;$('discoverCards').hidden=false;$('discoverInfo').hidden=false;introSeen=state.slot;try{localStorage.setItem('dmf_lab_test_intro_v1',introSeen)}catch(e){}}
$('labSkip').onclick=endIntro;
function pour(color){$('labIntro').style.setProperty('--lab-color',color);$('labChoices').hidden=true;if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){endIntro();return}$('labIntro').classList.add('playing');introTimer=setTimeout(endIntro,2400)}
function makePotions(){const palette=[['Morada','#b76bea'],['Verde','#40d9ae'],['Azul','#55aaff'],['Rosa','#f074b6'],['Naranja','#fa983f'],['Amarilla','#f4d34e'],['Roja','#ee6172'],['Turquesa','#30c9d8']];for(let i=palette.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[palette[i],palette[j]]=[palette[j],palette[i]]}let box=$('labChoices');box.replaceChildren();palette.slice(0,5).forEach(([name,color])=>{let b=document.createElement('button');b.type='button';b.textContent='Poción '+name.toLowerCase();b.setAttribute('aria-label','Elegir poción '+name.toLowerCase());b.style.cssText='margin:4px;border:2px solid '+color+';color:white;background:#173849';let dot=document.createElement('span');dot.style.cssText='display:inline-block;width:16px;height:16px;border-radius:50%;background:'+color+';margin-right:7px;vertical-align:middle';dot.setAttribute('aria-hidden','true');b.prepend(dot);b.onclick=()=>pour(color);box.append(b)})}

function maybeIntro(){let panel=$('panel-browser');if(!panel||panel.hidden||!state.ids.length||!state.slot||introSeen===state.slot||!$('labIntro').hidden)return;makePotions();$('labIntro').hidden=false;$('discoverCards').hidden=true;$('discoverInfo').hidden=true}
// Only the active mission and its attempts are retained. No old Lab or other DMF data is deleted.
const levels=[{name:'Fácil',runner:8,drive:8,targets:12,speed:165,road:105,time:35},{name:'Medio',runner:12,drive:12,targets:16,speed:190,road:125,time:32},{name:'Difícil',runner:16,drive:16,targets:20,speed:215,road:145,time:30}];
const games=['dino','road','targets'];
const names={dino:'🦖 Salto jurásico',road:'🏎️ Carrera de obstáculos',targets:'🎯 Caza de objetivos'};
let displayed=null,stopGame=()=>{},active=false;
function timeInfo(d){const base=new Date(d),h=d.getHours();if(h<8)base.setDate(base.getDate()-1);const day=[base.getFullYear(),base.getMonth()+1,base.getDate()].join('-');const count=h<8?5:h<11?1:h<14?2:h<17?3:h<20?4:5;const next=new Date(d);next.setSeconds(0,0);if(h<8)next.setHours(8,0,0,0);else if(h<11)next.setHours(11,0,0,0);else if(h<14)next.setHours(14,0,0,0);else if(h<17)next.setHours(17,0,0,0);else if(h<20)next.setHours(20,0,0,0);else{next.setDate(next.getDate()+1);next.setHours(8,0,0,0)}const days=Math.floor(Date.UTC(base.getFullYear(),base.getMonth(),base.getDate())/86400000);return{slot:day+'-'+count,index:((days*5+count-1)%9+9)%9,next,night:h<8||h>=20}}
function save(){try{localStorage.setItem(key,JSON.stringify({slot:state.slot,attempts:state.attempts,result:state.result}))}catch(e){}}
function el(tag,text,parent){let n=document.createElement(tag);if(text!==null)n.textContent=text;parent.append(n);return n}
function button(text,parent,fn){let b=el('button',text,parent);b.type='button';b.style.margin='6px';b.addEventListener('click',fn);return b}
function canvas(parent){let c=el('canvas',null,parent);c.width=360;c.height=240;c.style.cssText='display:block;max-width:100%;width:360px;height:auto;background:#e5f8ff;border-radius:12px;touch-action:manipulation';return c}
function choose(t){let s=null;try{s=JSON.parse(localStorage.getItem(key))}catch(e){};let attempts=0,result='';if(s&&s.slot===t.slot&&Number.isInteger(s.attempts)&&s.attempts>=0&&s.attempts<=3){attempts=s.attempts;result=['won','lost','playing',''].includes(s.result)?s.result:'';if(result==='playing')result='lost'}state={slot:t.slot,ids:[String(t.index)],index:t.index,attempts,result};save()}
function end(outcome){if(!active)return;if(timeInfo(new Date()).slot!==state.slot){update();return}active=false;stopGame();stopGame=()=>{};state.result=outcome;save();renderCard()}
function abort(){if(active)end('lost')}
function renderCard(){const box=$('discoverCards');box.replaceChildren();const item=state.index,game=games[item%3],lvl=levels[Math.floor(item/3)];let card=el('article',null,box);card.className='discover-card';el('h3',names[game],card);el('p','Nivel: '+lvl.name+' · Intentos restantes: '+(3-state.attempts)+' de 3',card);let goal=game==='dino'?'Salta '+lvl.runner+' cactus sin chocar.':game==='road'?'Supera '+lvl.drive+' barreras sin chocar.':'Toca '+lvl.targets+' objetivos en '+lvl.time+' segundos; cinco fallos terminan el intento.';el('p','Misión: '+goal,card);if(state.result==='won'){el('p','🏆 ¡Misión completada! Termina aquí hasta la próxima misión.',card);return}if(state.attempts>=3){el('p','Se acabaron los tres intentos. Vuelve en el próximo turno.',card);return}if(state.result==='lost')el('p','Intento terminado. Puedes volver a intentarlo si te quedan intentos.',card);button(state.attempts?'Volver a intentar':'Empezar misión',card,()=>{let now=timeInfo(new Date());if(now.slot!==state.slot){update();return}state.attempts++;state.result='playing';save();active=true;card.replaceChildren();el('h3',names[game]+' · '+lvl.name,card);el('p','Misión: '+goal+' Intentos restantes: '+(3-state.attempts)+' de 3.',card);let stage=el('div',null,card);if(game==='dino')startDino(stage,lvl);else if(game==='road')startRoad(stage,lvl);else startTargets(stage,lvl);button('Abandonar intento',card,abort)})}
function startDino(stage,lvl){el('p','Pulsa Saltar o la barra espaciadora para evitar los cactus.',stage);let c=canvas(stage),ctx=c.getContext('2d'),status=el('p','Cactus: 0 / '+lvl.runner,stage), y=0,vy=0,obs=[],passed=0,spawn=0,last=0,raf=0,dead=false;const ground=198;function jump(){if(!dead&&y===0)vy=360}let jumpButton=button('⬆️ Saltar',stage,jump);function key(e){if(!dead&&(e.code==='Space'||e.key==='ArrowUp')){e.preventDefault();jump()}}window.addEventListener('keydown',key);stopGame=()=>{dead=true;cancelAnimationFrame(raf);window.removeEventListener('keydown',key);jumpButton.disabled=true};function frame(ms){if(dead)return;let dt=last?Math.min((ms-last)/1000,0.04):0;last=ms;vy-=880*dt;y=Math.max(0,y+vy*dt);if(y===0&&vy<0)vy=0;spawn-=dt;if(spawn<=0){obs.push({x:380,passed:false});spawn=1.35+Math.random()*.25}ctx.fillStyle='#e5f8ff';ctx.fillRect(0,0,360,240);ctx.fillStyle='#78bd80';ctx.fillRect(0,ground,360,42);ctx.fillStyle='#177d69';ctx.fillRect(45,ground-30-y,26,30);ctx.fillStyle='#17324c';ctx.fillRect(63,ground-26-y,4,4);for(let o of obs){o.x-=lvl.speed*dt;ctx.fillStyle='#287f40';ctx.fillRect(o.x,ground-26,17,26);ctx.fillRect(o.x-4,ground-18,25,6);if(o.x<71&&o.x+17>45&&y<24){end('lost');return}if(!o.passed&&o.x+17<45){o.passed=true;passed++;status.textContent='Cactus: '+passed+' / '+lvl.runner;if(passed>=lvl.runner){end('won');return}}}obs=obs.filter(o=>o.x>-30);raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function startRoad(stage,lvl){el('p','Esquiva las barreras: usa ◀ ▶ o las flechas del teclado. Cada barrera superada cuenta.',stage);let c=canvas(stage),ctx=c.getContext('2d'),status=el('p','Barreras: 0 / '+lvl.drive,stage),lane=1,obs=[],passed=0,spawn=0,last=0,raf=0,dead=false;function move(n){if(!dead)lane=Math.max(0,Math.min(2,lane+n))}button('◀ Izquierda',stage,()=>move(-1));button('Derecha ▶',stage,()=>move(1));function key(e){if(!dead&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}}window.addEventListener('keydown',key);stopGame=()=>{dead=true;cancelAnimationFrame(raf);window.removeEventListener('keydown',key)};function frame(ms){if(dead)return;let dt=last?Math.min((ms-last)/1000,0.04):0;last=ms;spawn-=dt;if(spawn<=0){let safe=Math.floor(Math.random()*3);let blocked=[0,1,2].filter(i=>i!==safe);if(lvl.name==='Fácil')blocked=[blocked[Math.floor(Math.random()*2)]];obs.push({y:-30,blocked,passed:false});spawn=1.5}ctx.fillStyle='#344c5a';ctx.fillRect(0,0,360,240);ctx.setLineDash([12,10]);ctx.strokeStyle='#b2c9ce';ctx.lineWidth=2;[120,240].forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,240);ctx.stroke()});ctx.setLineDash([]);ctx.fillStyle='#10c9dc';ctx.fillRect(lane*120+42,193,36,36);ctx.fillStyle='#fff';ctx.fillRect(lane*120+48,198,24,8);for(let o of obs){o.y+=lvl.road*dt;ctx.fillStyle='#fa6c55';o.blocked.forEach(i=>ctx.fillRect(i*120+16,o.y,88,20));if(o.y<229&&o.y+20>193&&o.blocked.includes(lane)){end('lost');return}if(!o.passed&&o.y>229){o.passed=true;passed++;status.textContent='Barreras: '+passed+' / '+lvl.drive;if(passed>=lvl.drive){end('won');return}}}obs=obs.filter(o=>o.y<270);raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function startTargets(stage,lvl){el('p','Toca los círculos antes de que acabe el tiempo. Pulsar fuera cuenta como fallo.',stage);let c=canvas(stage),ctx=c.getContext('2d'),status=el('p','',stage),hits=0,misses=0,deadline=performance.now()+lvl.time*1000,raf=0,dead=false,target={x:180,y:120},radius=lvl.name==='Fácil'?24:lvl.name==='Medio'?20:16;function newTarget(){target={x:radius+Math.random()*(360-2*radius),y:radius+Math.random()*(240-2*radius)}}newTarget();function hit(e){if(dead)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*240/r.height;if(Math.hypot(x-target.x,y-target.y)<=radius){hits++;if(hits>=lvl.targets){end('won');return}newTarget()}else{misses++;if(misses>=5){end('lost');return}}}c.addEventListener('pointerdown',hit);stopGame=()=>{dead=true;cancelAnimationFrame(raf);c.removeEventListener('pointerdown',hit)};function frame(now){if(dead)return;let left=Math.max(0,Math.ceil((deadline-now)/1000));status.textContent='Objetivos: '+hits+' / '+lvl.targets+' · Fallos: '+misses+' / 5 · Tiempo: '+left+' s';if(left===0){end('lost');return}ctx.fillStyle='#e5f8ff';ctx.fillRect(0,0,360,240);ctx.fillStyle='#ef4f65';ctx.beginPath();ctx.arc(target.x,target.y,radius,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(target.x,target.y,radius*.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef4f65';ctx.beginPath();ctx.arc(target.x,target.y,radius*.25,0,Math.PI*2);ctx.fill();raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function update(){const t=timeInfo(new Date());if(state.slot!==t.slot){if(active){active=false;stopGame();stopGame=()=>{}}choose(t);displayed=null}if(displayed!==state.slot){displayed=state.slot;renderCard()}$('discoverClock').textContent='Misión actual hasta '+t.next.toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})+(t.night?' · Turno nocturno: se mantiene hasta las 08:00.':'');$('discoverInfo').hidden=!$('labIntro').hidden;$('discoverInfo').textContent='Hay 3 juegos propios y 9 combinaciones de juego y nivel, que se repiten por turnos. Solo se guarda la misión activa y sus intentos en este navegador: al empezar se consume un intento; recargar o salir durante la partida lo pierde. Al cambiar de turno la anterior desaparece. Si el navegador bloquea o borra el almacenamiento, el contador puede reiniciarse.'}
new MutationObserver(()=>{if($('panel-browser').hidden)abort();else{update();maybeIntro()}}).observe($('panel-browser'),{attributes:true,attributeFilter:['hidden']});update();maybeIntro();setInterval(()=>{update();maybeIntro()},1000);document.addEventListener('visibilitychange',()=>{if(document.hidden)abort();else update()});window.addEventListener('pageshow',update);window.addEventListener('focus',update);
})();
</script>
