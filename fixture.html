<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;color:white;background:#05070a;font:20px sans-serif;isolation:isolate}#dmfPixelBackground{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;display:none;background-color:#05070a;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:20px 20px}body[data-decor-bg="rainbow-pixels"] #dmfPixelBackground{display:block}button{padding:20px}main{height:180vh}h1{text-align:center;margin-top:28vh}</style></head><body data-decor-bg="rainbow-pixels"><button onclick="this.textContent='Clicked'">Click test</button><main><h1>DMF</h1></main><script>(()=>{
 // This layer belongs only to the optional decorative wallpaper; it never handles input.
 const canvas=document.createElement('canvas');canvas.id='dmfPixelBackground';canvas.setAttribute('aria-hidden','true');document.body.prepend(canvas);
 const ctx=canvas.getContext('2d');if(!ctx)return;
 const motion=matchMedia('(prefers-reduced-motion: reduce)');
 const cell=20, lifetime=4200, maxCells=750;
 let active=false,raf=0,lastFrame=0,width=0,height=0,previous=null,hue=0;
 const cells=new Map();
 function size(){width=innerWidth;height=innerHeight;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cells.clear();previous=null;}
 function draw(now){
  ctx.clearRect(0,0,width,height);
  for(const [key,c] of cells){const age=now-c.t;if(age>=lifetime){cells.delete(key);continue}
   const fade=Math.pow(1-age/lifetime,1.65),alpha=c.power*fade;
   ctx.globalAlpha=alpha*.22;ctx.fillStyle=`hsl(${c.hue} 100% 55%)`;ctx.fillRect(c.x*cell-3,c.y*cell-3,cell+6,cell+6);
   ctx.globalAlpha=alpha;ctx.fillStyle=`hsl(${c.hue} 100% ${47+c.bright*18}%)`;ctx.fillRect(c.x*cell+1,c.y*cell+1,cell-2,cell-2);
  }ctx.globalAlpha=1;
 }
 function tick(now){raf=0;if(!active||document.hidden||motion.matches)return;if(now-lastFrame>=32){draw(now);lastFrame=now}if(cells.size)raf=requestAnimationFrame(tick)}
 function schedule(){if(active&&!motion.matches&&!document.hidden&&!raf&&cells.size)raf=requestAnimationFrame(tick)}
 function stamp(x,y,now){
  const cx=Math.floor(x/cell),cy=Math.floor(y/cell),radius=4;
  for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){
   const distance=Math.hypot(dx,dy);if(distance>radius+.15)continue;
   const gx=cx+dx,gy=cy+dy;if(gx<0||gy<0||gx*cell>=width||gy*cell>=height)continue;
   const seed=Math.abs(Math.sin(gx*127.1+gy*311.7)*43758.5453)%1;
   const power=Math.min(.78,(.17+.61*(1-distance/(radius+1)))*(.56+seed*.44));
   const key=gx+','+gy;
   cells.delete(key);cells.set(key,{x:gx,y:gy,t:now,power,bright:seed,hue:(hue+gx*2+gy*2+3600)%360});
  }
  while(cells.size>maxCells)cells.delete(cells.keys().next().value);
 }
 function interact(x,y){
  if(!active||motion.matches||document.hidden||document.body.classList.contains('password-locked')||!Number.isFinite(x)||!Number.isFinite(y))return;
  const now=performance.now();if(previous&&now-previous.t<220){const distance=Math.hypot(x-previous.x,y-previous.y),steps=Math.min(60,Math.ceil(distance/(cell*.6)));for(let i=1;i<=steps;i++){hue=(hue+1.4)%360;stamp(previous.x+(x-previous.x)*i/steps,previous.y+(y-previous.y)*i/steps,now)}}else{hue=(hue+5)%360;stamp(x,y,now)}
  previous={x,y,t:now};schedule();
 }
 function sync(){const wanted=document.body.dataset.decorBg==='rainbow-pixels'&&!document.body.dataset.customBg;if(wanted===active)return;active=!!wanted;if(active){size()}else{if(raf)cancelAnimationFrame(raf);raf=0;cells.clear();previous=null;ctx.clearRect(0,0,width,height)}}
 document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')interact(e.clientX,e.clientY)},{passive:true});
 document.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')interact(e.clientX,e.clientY)},{passive:true});
 for(const name of ['touchstart','touchmove'])document.addEventListener(name,e=>{for(const t of e.changedTouches)interact(t.clientX,t.clientY)},{passive:true});
 window.addEventListener('resize',()=>{if(active)size()},{passive:true});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;previous=null}else schedule()});
 motion.addEventListener('change',()=>{if(raf)cancelAnimationFrame(raf);raf=0;cells.clear();previous=null;ctx.clearRect(0,0,width,height)});
 new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['data-decor-bg','data-custom-bg']});
 window.addEventListener('pagehide',()=>{if(raf)cancelAnimationFrame(raf);raf=0});
 window.addEventListener('pageshow',schedule);
 sync();
})();
</script></body></html>
