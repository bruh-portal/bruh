<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fútbol · DMF</title><style>*{box-sizing:border-box}body{font-family:system-ui;background:#112139;color:#f5f8ff;margin:0}main{max-width:900px;margin:auto;padding:12px}h2{margin:8px 0}select,button{font:inherit;padding:9px;border:0;border-radius:9px}select{background:#fff;color:#19334b}button{background:#2d8195;color:white;font-weight:700;cursor:pointer}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.match{background:#20354d;border-radius:10px;padding:12px;margin:8px 0}.clubs{display:flex;align-items:center;justify-content:space-between;gap:8px}.team{flex:1;text-align:center;font-weight:700}.score{font-weight:800;font-size:23px}.meta{text-align:center;font-size:13px;color:#c0d3df;margin-top:6px}.live{color:#ffcb66}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:7px;border-bottom:1px solid #3b5064}td:not(:nth-child(2)),th:not(:nth-child(2)){text-align:center}small{color:#c6d8df}.notice{background:#20354d;border-radius:10px;padding:12px}@media(max-width:480px){.team{font-size:13px}td,th{padding:5px}}</style></head><body><main><h2>⚽ Fútbol</h2><p>Consulta resultados, próximos partidos y clasificación.</p><div class="bar"><label for="league">Competición:</label><select id="league"><option value="esp.1">LaLiga</option><option value="uefa.champions">Champions League</option><option value="eng.1">Premier League</option><option value="esp.2">Segunda División</option></select><button id="matches">Partidos</button><button id="table">Clasificación</button><button id="refresh">Actualizar</button></div><p><small>Datos de ESPN. Pueden cambiar o no estar disponibles en todas las redes.</small></p><div id="output" aria-live="polite"></div></main><script>
const out=document.getElementById('output'),league=document.getElementById('league');let view='matches',controller=null;function el(t,cls,txt){let n=document.createElement(t);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function dateKey(d){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`}function dateLabel(s){let d=new Date(s);return isNaN(d)?'Horario pendiente':new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(d)}function notice(text){out.replaceChildren(el('p','notice',text))}async function load(){if(controller)controller.abort();controller=new AbortController();let signal=controller.signal,id=league.value;notice('Cargando datos…');try{let root='https://site.api.espn.com/apis/';let url;if(view==='matches'){let start=new Date(),end=new Date();start.setDate(start.getDate()-7);end.setDate(end.getDate()+14);url=root+'site/v2/sports/soccer/'+encodeURIComponent(id)+'/scoreboard?dates='+dateKey(start)+'-'+dateKey(end)+'&limit=100&lang=es'}else url=root+'v2/sports/soccer/'+encodeURIComponent(id)+'/standings?lang=es';let r=await fetch(url,{signal});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(signal.aborted)return;out.replaceChildren();if(view==='matches'){let events=(j.events||[]).sort((a,b)=>new Date(a.date)-new Date(b.date));if(!events.length){notice('No hay partidos disponibles para estas fechas.');return}for(let ev of events){let comp=ev.competitions?.[0],home=comp?.competitors?.find(c=>c.homeAway==='home'),away=comp?.competitors?.find(c=>c.homeAway==='away');if(!home||!away)continue;let state=ev.status?.type?.state||'pre',line=el('div','clubs'),box=el('div','match');line.append(el('div','team',home.team?.displayName||'Local'),el('div','score',state==='pre'?'—':(home.score??'0')+' : '+(away.score??'0')),el('div','team',away.team?.displayName||'Visitante'));let label=state==='in'?'🔴 En directo':state==='post'?'Finalizado':'Próximo';box.append(line,el('div','meta'+(state==='in'?' live':''),dateLabel(ev.date)+' · '+label));out.append(box)}}else{let groups=j.children||[];if(!groups.some(g=>g.standings?.entries?.length)){notice('No hay clasificación disponible para esta competición.');return}for(let g of groups){if(groups.length>1)out.append(el('h3','',g.name));let t=el('table'),head=el('tr');['#','Equipo','PJ','Pts'].forEach(x=>head.append(el('th','',x)));t.append(head);for(let [i,row] of (g.standings?.entries||[]).entries()){let stats=row.stats||[],get=n=>stats.find(x=>x.name===n)?.displayValue??'—',tr=el('tr');[String(i+1),row.team?.displayName||'Equipo',get('gamesPlayed'),get('points')].forEach(x=>tr.append(el('td','',x)));t.append(tr)}out.append(t)}}}catch(err){if(err.name!=='AbortError')notice('No se pudieron cargar los datos. Comprueba la conexión o pulsa Actualizar.')}}document.getElementById('matches').onclick=()=>{view='matches';load()};document.getElementById('table').onclick=()=>{view='table';load()};document.getElementById('refresh').onclick=load;league.onchange=load;load();</script></body></html>
