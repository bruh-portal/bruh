<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade DMF</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1224,#142b43);color:white;font-family:system-ui;text-align:center}h2{margin:10px}p{margin:6px}.board{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:min(94vw,480px);margin:12px auto}.cell{aspect-ratio:1;border:0;border-radius:7px;background:#648f5d;box-shadow:inset 0 -3px #466f43;color:#133d83;font-size:clamp(14px,4vw,23px);font-weight:bold;cursor:pointer}.cell:nth-child(even){background:#77a76b}.cell.open{background:#e7dab6;box-shadow:none}.cell.mine{background:#f6796b}button.control{background:#4d91d5;color:white;padding:10px 18px;border:0;border-radius:9px;font-weight:bold;margin:5px}canvas{display:block;width:min(96vw,620px);height:auto;margin:12px auto;background:#101b33;border-radius:14px;touch-action:none;border:2px solid #406691}.hint{font-size:14px;color:#c3d5df}</style></head><body><h2 id="title"></h2><p id="status"></p><div id="difficulty" hidden><label for="level">Nivel: </label><select id="level" style="padding:8px;border-radius:8px;font-size:16px"><option value="easy">Fácil (10 minas)</option><option value="medium">Medio (25 minas)</option><option value="hard">Difícil (45 minas)</option></select></div><div id="mine" class="board" hidden></div><canvas id="breaker" width="600" height="440" hidden></canvas><button class="control" id="reset">Nueva partida</button><p class="hint" id="hint"></p><script>
const isMine=new URLSearchParams(location.search).get('game')==='minas';const title=document.getElementById('title'),status=document.getElementById('status'),grid=document.getElementById('mine'),canvas=document.getElementById('breaker'),hint=document.getElementById('hint');let stop=()=>{};
function mines(){stop();title.textContent='💣 Buscaminas';hint.textContent='Toca para descubrir. Clic derecho o pulsación larga para poner bandera.';grid.hidden=false;canvas.hidden=true;document.getElementById('difficulty').hidden=false;grid.innerHTML='';let levels={easy:{size:9,mines:10},medium:{size:12,mines:25},hard:{size:15,mines:45}},cfg=levels[document.getElementById('level').value],N=cfg.size,total=N*N,M=cfg.mines;grid.style.gridTemplateColumns=`repeat(${N},1fr)`;let cells=Array.from({length:total},()=>({mine:false,open:false,flag:false,num:0})),first=true,done=false,flags=0;status.textContent='Encuentra las '+M+' minas';let buttons=[];function around(i){let x=i%N,y=Math.floor(i/N),a=[];for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)if((xx||yy)&&x+xx>=0&&x+xx<N&&y+yy>=0&&y+yy<N)a.push((y+yy)*N+x+xx);return a}function setup(i){let forbidden=new Set([i,...around(i)]),pool=Array.from({length:total},(_,k)=>k).filter(k=>!forbidden.has(k));for(let n=0;n<M;n++){let k=Math.floor(Math.random()*pool.length);cells[pool.splice(k,1)[0]].mine=true}cells.forEach((c,k)=>c.num=around(k).filter(j=>cells[j].mine).length)}function render(i){let c=cells[i],b=buttons[i];b.className='cell'+(c.open?' open':'')+(c.open&&c.mine?' mine':'');b.textContent=c.open?(c.mine?'💣':c.num||''):c.flag?'🚩':'';if(c.open&&c.num)b.style.color=['','#2873bf','#168451','#d5423b','#62449a','#9d3d32','#048d91','#222','#666'][c.num]}function flag(i){if(done||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;render(i);status.textContent='Banderas: '+flags+' / '+M}function open(i){if(done||cells[i].open||cells[i].flag)return;if(first){setup(i);first=false}let c=cells[i];c.open=true;render(i);if(c.mine){done=true;cells.forEach((v,k)=>{if(v.mine){v.open=true;render(k)}});status.textContent='¡Boom! Vuelve a intentarlo';return}if(c.num===0)around(i).forEach(open);if(cells.filter(v=>v.open&&!v.mine).length===total-M){done=true;status.textContent='¡Has ganado! 🎉'}}for(let i=0;i<total;i++){let b=document.createElement('button');b.className='cell';b.setAttribute('aria-label','Casilla '+(i+1));let timer,long=false;b.addEventListener('pointerdown',()=>{long=false;timer=setTimeout(()=>{long=true;flag(i)},500)});b.addEventListener('pointerup',()=>clearTimeout(timer));b.addEventListener('pointercancel',()=>clearTimeout(timer));b.onclick=()=>{if(!long)open(i)};b.oncontextmenu=e=>{e.preventDefault();flag(i)};buttons.push(b);grid.append(b)}}
document.getElementById('level').onchange=mines;

function breaker(){stop();title.textContent='🧱 Rompebloques';hint.textContent='Mueve la barra con el ratón, el dedo o las flechas. Espacio para empezar.';grid.hidden=true;canvas.hidden=false;let c=canvas.getContext('2d'),p=260,ball={x:300,y:390,vx:3.1,vy:-3.8},bricks=[],running=true,started=false,score=0,frame=0,keys={};for(let y=0;y<5;y++)for(let x=0;x<9;x++)bricks.push({x:23+x*62,y:55+y*27,on:true,color:['#f36d6d','#ffad53','#edda67','#6ece9d','#6eabee'][y]});status.textContent='Puntos: 0 — toca el tablero para empezar';function move(e){let r=canvas.getBoundingClientRect();p=Math.max(0,Math.min(500,(e.clientX-r.left)*600/r.width-50))}function ondown(e){move(e);started=true}function kd(e){if(['ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();keys[e.key]=true;if(e.key===' ')started=true}}function ku(e){keys[e.key]=false}canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerdown',ondown);window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);function draw(){if(!running)return;if(keys.ArrowLeft)p=Math.max(0,p-7);if(keys.ArrowRight)p=Math.min(500,p+7);c.clearRect(0,0,600,440);c.fillStyle='#172f51';c.fillRect(0,0,600,440);c.fillStyle='#dcecf8';c.font='bold 16px system-ui';c.fillText('PUNTOS '+score,20,30);for(let b of bricks)if(b.on){c.fillStyle=b.color;c.beginPath();c.roundRect(b.x,b.y,56,20,5);c.fill()}c.fillStyle='#72c7f5';c.beginPath();c.roundRect(p,412,100,12,6);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(ball.x,ball.y,8,0,Math.PI*2);c.fill();if(started){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>592)ball.vx*=-1;if(ball.y<8)ball.vy=Math.abs(ball.vy);if(ball.y>=404&&ball.y<421&&ball.x>=p&&ball.x<=p+100&&ball.vy>0){ball.vy=-Math.abs(ball.vy);ball.vx=(ball.x-(p+50))/13}for(let b of bricks)if(b.on&&ball.x>b.x-6&&ball.x<b.x+62&&ball.y>b.y-6&&ball.y<b.y+26){b.on=false;ball.vy*=-1;score+=10;status.textContent='Puntos: '+score;break}if(ball.y>450){started=false;running=false;status.textContent='Fin de partida — puntos: '+score}if(bricks.every(b=>!b.on)){running=false;status.textContent='¡Has ganado! 🎉'}}if(running)frame=requestAnimationFrame(draw)}draw();stop=()=>{running=false;cancelAnimationFrame(frame);canvas.removeEventListener('pointermove',move);canvas.removeEventListener('pointerdown',ondown);window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku)}}document.getElementById('reset').onclick=()=>isMine?mines():breaker();isMine?mines():breaker();</script></body></html>
