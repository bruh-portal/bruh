<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'"><title>DMF — cálculo local temporal</title></head><body>
<h1>DMF — cálculo local temporal</h1><p>La contraseña se procesa localmente y no se envía.</p>
<form id="f"><label>Contraseña nueva <input id="p" type="password" autocomplete="off" required></label><button>Calcular</button></form><pre id="result"></pre>
<script>
'use strict';
const b64 = a => btoa(String.fromCharCode(...a));
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const p = document.getElementById('p');
  const bytes = new TextEncoder().encode(p.value); p.value = '';
  try {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey('raw', bytes, 'PBKDF2', false, ['deriveBits']); bytes.fill(0);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'}, key, 256);
    document.getElementById('result').textContent = 'SALT=' + b64(salt) + '\nHASH=' + b64(new Uint8Array(bits));
  } catch(err) { bytes.fill(0); document.getElementById('result').textContent = 'Error al calcular'; }
});
</script></body></html>
