<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><title>DMF ensayo juego</title><style>body{font:18px system-ui;background:#071828;color:white;padding:20px}button{font:inherit}button:focus{outline:3px solid yellow}</style><h1>Óptica del laboratorio</h1><button id="easy">Fácil</button><button id="medium">Medio</button><button id="hard">Difícil</button><main id="stage"></main><script>/* Original optical puzzle for DMF: each mission is a single laser circuit. */
/* Original optical puzzle for DMF: each mission is a single laser circuit. */
function startPuzzle(stage,lvl,end){
 const size={Fácil:5,Medio:6,Difícil:7}[lvl.name], n=size, start=[0,n-1], target=[n-1,0], max={Fácil:6,Medio:4,Difícil:3}[lvl.name];
 // Correct sequence: /, \, /, \, /. Additional unlabelled sockets are decoys.
 const path=[[n-2,n-1],[n-2,n-3],[1,n-3],[1,n-2],[n-1,n-2]];
 const extras=n===5?[[2,0],[0,1]]:n===6?[[2,0],[0,2],[3,2]]:[[2,0],[0,2],[3,2],[3,1],[1,1]];
 const sockets=path.concat(extras), key=(x,y)=>x+','+y, tiles=new Map(sockets.map(p=>[key(...p),0]));
 const gates=[[n-2,n-2],[2,n-3],[n-1,1]]; let failures=0,dead=false;
 const add=(tag,text,parent)=>{const e=document.createElement(tag);if(text!==null)e.textContent=text;parent.append(e);return e};
 add('p','Misión: lleva el láser desde la fuente ⚡ hasta el receptor 🎯 pasando por los sensores A, B y C en ese orden. Gira los espejos y pulsa Disparar. Si sale del tablero, entra en un bucle o activa los sensores en otro orden, el disparo falla.',stage);
 add('p','Haz clic o usa Tab y Enter/Espacio para girar cada espejo. Cada casilla alterna entre vacío, / y \\. Cada partida admite '+max+' disparos fallidos; si los agotas pierdes uno de tus tres intentos de misión.',stage);
 const board=add('div',null,stage);board.style.cssText=`display:grid;grid-template-columns:repeat(${n}, minmax(34px,54px));justify-content:center;gap:3px;margin:12px auto;`;
 const status=add('p','',stage);status.setAttribute('role','status');status.style.cssText='min-height:3em;text-align:center';
 const controls=add('div',null,stage);controls.style.cssText='text-align:center';const fire=add('button','⚡ Disparar láser',controls);fire.type='button';fire.style.cssText='min-height:48px;padding:8px 18px';
 let cells={};function render(){for(let y=0;y<n;y++)for(let x=0;x<n;x++){let id=key(x,y),c=cells[id];if(!c)continue;const value=tiles.get(id);c.textContent=['·','╱','╲'][value];c.setAttribute('aria-label','Espejo fila '+(y+1)+', columna '+(x+1)+': '+['vacío','barra ascendente','barra descendente'][value]);}status.textContent='Disparos fallidos: '+failures+' / '+max+'. Gira los espejos y completa A → B → C.'}
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){let id=key(x,y),el;if(tiles.has(id)){el=add('button','',board);el.type='button';el.style.cssText='height:50px;margin:0;padding:0;font-size:30px;font-weight:bold;background:#154f67;color:white;border:2px solid #64dbee;border-radius:6px';el.addEventListener('click',()=>{tiles.set(id,(tiles.get(id)+1)%3);render()});cells[id]=el}else{let text=x===start[0]&&y===start[1]?'⚡':x===target[0]&&y===target[1]?'🎯':gates.findIndex(([gx,gy])=>gx===x&&gy===y);text=typeof text==='number'?(text<0?'':String.fromCharCode(65+text)):text;el=add('div',text,board);el.style.cssText='display:grid;place-items:center;height:50px;border:1px solid #547c8b;border-radius:6px;background:#102b38;font-weight:bold';}}
 function trace(){let x=start[0],y=start[1],dx=1,dy=0,passed='',visited=new Set();for(let i=0;i<n*n*4;i++){x+=dx;y+=dy;if(x<0||x>=n||y<0||y>=n)return{ok:false,why:'El haz salió del tablero.'};let id=key(x,y)+','+dx+','+dy;if(visited.has(id))return{ok:false,why:'El haz quedó atrapado en un bucle.'};visited.add(id);let gi=gates.findIndex(([gx,gy])=>gx===x&&gy===y);if(gi>=0){let letter=String.fromCharCode(65+gi);if(!passed.includes(letter))passed+=letter;if(!'ABC'.startsWith(passed))return{ok:false,why:'Los sensores no se atravesaron en el orden correcto.'}}if(x===target[0]&&y===target[1])return{ok:passed==='ABC',why:passed==='ABC'?'':'El receptor necesita los sensores A, B y C en orden.'};let v=tiles.get(key(x,y))||0;if(v===1)[dx,dy]=[-dy,-dx];else if(v===2)[dx,dy]=[dy,dx]}return{ok:false,why:'El haz quedó atrapado en un bucle.'}}
 fire.addEventListener('click',()=>{if(dead)return;let result=trace();if(result.ok){dead=true;end('won');return}failures++;if(failures>=max){dead=true;end('lost');return}status.textContent=result.why+' Disparos fallidos: '+failures+' / '+max+'.'});render();return ()=>{dead=true};
}
const stage=document.getElementById("stage");function start(name){stage.replaceChildren();startPuzzle(stage,{name},r=>{stage.textContent=r})}document.getElementById("easy").onclick=()=>start("Fácil");document.getElementById("medium").onclick=()=>start("Medio");document.getElementById("hard").onclick=()=>start("Difícil");start("Fácil");</script>
