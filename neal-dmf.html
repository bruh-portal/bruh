<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juegos inspirados en Neal.fun</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f5f7ff;color:#18243e}main{max-width:900px;margin:auto;padding:24px}h1{font-size:clamp(24px,5vw,38px)}button{background:#097c80;color:white;border:0;border-radius:9px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}button:disabled{background:#a1a8b1}button:focus-visible{outline:3px solid #ff9c18}small{color:#536477}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:white;border-radius:12px;padding:14px;box-shadow:0 2px 9px #0d264012}.card button{margin:3px}#answer{font:inherit;padding:10px;border:1px solid #8e9aa8;border-radius:8px;max-width:100%}canvas{background:white;border:2px solid #cbd4e4;border-radius:12px;touch-action:none;max-width:100%;height:auto}#balance{position:sticky;top:0;background:#ecfff8;padding:12px;border-radius:10px;font-size:1.3em;font-weight:bold}#message{font-weight:bold;min-height:1.5em}</style></head><body><main><div id="app"></div><p><small>Juego alternativo creado para DMF, inspirado en Neal.fun. No es un juego oficial.</small></p></main><script>
const a=document.getElementById('app'), game=new URLSearchParams(location.search).get('juego');
if(game==='password'){
 a.innerHTML='<h1>🔐 El juego de la contraseña</h1><p>Versión alternativa en español. No uses una contraseña real.</p><label for="pass">Escribe una contraseña para el juego:</label><p><input id="pass" type="text" autocomplete="off" spellcheck="false" placeholder="Escribe aquí…"></p><p id="count"></p><div id="rules"></div><p id="result" role="status"></p><button id="resetPass">Empezar de nuevo</button>';
 const field=document.getElementById('pass');const rules=[['Debe tener al menos 6 caracteres.',p=>p.length>=6],['Debe incluir una mayúscula.',p=>/[A-ZÁÉÍÓÚÑ]/.test(p)],['Debe incluir un número.',p=>/[0-9]/.test(p)],['Debe incluir un símbolo: ! ? # o $.',p=>/[!?#$]/.test(p)],['Debe incluir un color: rojo, azul o verde.',p=>/rojo|azul|verde/i.test(p)],['La suma de sus números debe ser 10.',p=>[...p].filter(c=>/[0-9]/.test(c)).reduce((s,c)=>s+Number(c),0)===10],['Debe incluir un día: lunes, martes o viernes.',p=>/lunes|martes|viernes/i.test(p)],['Debe incluir el emoji de una estrella ⭐.',p=>p.includes('⭐')],['Debe tener al menos 20 caracteres.',p=>Array.from(p).length>=20],['Debe incluir la palabra DMF.',p=>/DMF/i.test(p)]];let unlocked=1;
 function update(){const p=field.value;while(unlocked<rules.length&&rules.slice(0,unlocked).every(r=>r[1](p)))unlocked++;document.getElementById('count').textContent='Caracteres: '+Array.from(p).length;const box=document.getElementById('rules');box.replaceChildren();rules.slice(0,unlocked).forEach((rule,i)=>{let div=document.createElement('p');div.className='card';div.textContent=(rule[1](p)?'✅ ':'❌ ')+'Regla '+(i+1)+': '+rule[0];box.append(div)});document.getElementById('result').textContent=unlocked===rules.length&&rules.every(r=>r[1](p))?'¡Ganaste! Has cumplido todas las reglas.':''}field.oninput=update;document.getElementById('resetPass').onclick=()=>{field.value='';unlocked=1;update();field.focus()};update();
}else if(game==='infinite'){
 a.innerHTML='<h1>♾️ Crea elementos</h1><p>Versión alternativa en español, con recetas limitadas. Elige dos elementos para combinarlos.</p><p id="craftStatus" role="status"></p><div class="grid" id="elements"></div><p><button id="craftReset">Borrar descubrimientos</button></p>';
 const key='dmfCraftEspanolV1',start=['💧 Agua','🔥 Fuego','🌱 Tierra','💨 Aire'];const recipes=[['💧 Agua','🔥 Fuego','☁️ Vapor'],['💧 Agua','🌱 Tierra','🌿 Planta'],['💧 Agua','💨 Aire','🌊 Ola'],['🔥 Fuego','🌱 Tierra','🌋 Lava'],['🔥 Fuego','💨 Aire','🌫️ Humo'],['🌱 Tierra','💨 Aire','🌪️ Polvo'],['💧 Agua','💧 Agua','🌊 Lago'],['🔥 Fuego','🔥 Fuego','☀️ Sol'],['🌱 Tierra','🌱 Tierra','🏔️ Montaña'],['💨 Aire','💨 Aire','🌬️ Viento'],['🌿 Planta','💧 Agua','🌳 Árbol'],['🌿 Planta','☀️ Sol','🌻 Flor'],['🌳 Árbol','🔥 Fuego','🪵 Carbón'],['🌳 Árbol','🌳 Árbol','🌲 Bosque'],['🌋 Lava','💧 Agua','🪨 Piedra'],['🪨 Piedra','💨 Aire','🏖️ Arena'],['🏖️ Arena','🔥 Fuego','🪟 Cristal'],['☁️ Vapor','💨 Aire','☁️ Nube'],['☁️ Nube','💧 Agua','🌧️ Lluvia'],['☀️ Sol','🌧️ Lluvia','🌈 Arcoíris'],['🌊 Lago','🌊 Lago','🌊 Mar'],['🌊 Mar','🌊 Mar','🌍 Océano'],['🌿 Planta','🌿 Planta','🌼 Jardín'],['🌻 Flor','🌼 Jardín','🦋 Mariposa'],['🌧️ Lluvia','🌱 Tierra','🟤 Barro'],['🟤 Barro','🔥 Fuego','🧱 Ladrillo'],['🧱 Ladrillo','🧱 Ladrillo','🏠 Casa'],['🏠 Casa','🏠 Casa','🏙️ Ciudad'],['🪨 Piedra','🪨 Piedra','🗿 Roca'],['🌬️ Viento','🌱 Tierra','🌪️ Tormenta de polvo'],['🌧️ Lluvia','💨 Aire','⛈️ Tormenta'],['🌊 Ola','💨 Aire','🏄 Surf'],['🌲 Bosque','🌧️ Lluvia','🍄 Seta'],['☀️ Sol','🏖️ Arena','🏝️ Playa'],['🌳 Árbol','🪨 Piedra','🪓 Herramienta'],['🌋 Lava','🌋 Lava','🌋 Volcán']];let discovered=[...start],first=null;try{let saved=JSON.parse(localStorage.getItem(key)||'null');let allowed=new Set([...start,...recipes.map(x=>x[2])]);if(Array.isArray(saved))discovered=[...new Set([...start,...saved.filter(x=>allowed.has(x))])]}catch{}function render(msg){let box=document.getElementById('elements');box.replaceChildren();document.getElementById('craftStatus').textContent=msg||('Descubrimientos: '+discovered.length+' de '+new Set([...start,...recipes.map(x=>x[2])]).size+'. '+(first?'Elegido: '+first+'. Elige otro elemento.':'Elige un elemento.'));discovered.forEach(item=>{let b=document.createElement('button');b.textContent=item;b.setAttribute('aria-pressed',String(item===first));b.onclick=()=>{if(!first){first=item;render()}else{let x=first;first=null;let found=recipes.find(([a,b])=>(a===x&&b===item)||(a===item&&b===x));if(found){let result=found[2],fresh=!discovered.includes(result);if(fresh){discovered.push(result);try{localStorage.setItem(key,JSON.stringify(discovered))}catch{}}render(x+' + '+item+' = '+result+(fresh?' ¡Nuevo!':''))}else render('Esa mezcla no tiene receta. ¡Prueba otra!')}};box.append(b)})}document.getElementById('craftReset').onclick=()=>{if(!confirm('¿Borrar tus descubrimientos?'))return;discovered=[...start];first=null;try{localStorage.removeItem(key)}catch{}render()};render();
}else if(game==='robot'){
 let level=0;const puzzles=[{q:'Pulsa la casilla que contiene una estrella.',opts:['🌙','⭐','🍀','🌈'],correct:1},{q:'¿Qué número sigue? 2, 4, 6, …',opts:['7','8','9','10'],correct:1},{q:'Escribe el resultado de 9 + 6.',answers:['15']},{q:'Selecciona el animal que puede volar.',opts:['🐢','🐬','🦉','🦀'],correct:2},{q:'Escribe SOL al revés.',answers:['los']},{q:'¿Cuál es el más pequeño?',opts:['Elefante','Montaña','Hormiga','Ballena'],correct:2},{q:'¿Qué color sale al mezclar azul y amarillo? Escríbelo.',answers:['verde']},{q:'¿Cuántos lados tiene un triángulo?',opts:['2','3','4','5'],correct:1},{q:'Escribe la palabra humana sin la primera letra.',answers:['umana']},{q:'Elige el número impar.',opts:['12','20','18','17'],correct:3},{q:'Última prueba: ¿cuál es diferente?',opts:['🍎','🍎','🍋','🍎'],correct:2}];
 function draw(){if(level>=puzzles.length){a.innerHTML='<h1>🤖 ¿Eres humano?</h1><p>¡Has superado todas las pruebas!</p><button id="again">Volver a jugar</button>';document.getElementById('again').onclick=()=>{level=0;draw()};return}let p=puzzles[level];a.innerHTML='<h1>🤖 ¿Eres humano?</h1><p>Prueba '+(level+1)+' de '+puzzles.length+'</p><h2></h2><div class="grid" id="choices"></div><p id="message" role="status"></p>';a.querySelector('h2').textContent=p.q;const box=document.getElementById('choices');function check(ok){if(ok){level++;draw()}else document.getElementById('message').textContent='Esa no es. ¡Prueba otra vez!'}if(p.answers){let form=document.createElement('form'),input=document.createElement('input'),button=document.createElement('button');input.id='answer';input.placeholder='Escribe tu respuesta';input.setAttribute('aria-label','Tu respuesta');input.autocomplete='off';button.type='submit';button.textContent='Comprobar';form.append(input,button);form.onsubmit=e=>{e.preventDefault();let v=input.value.trim().toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'');check(p.answers.includes(v))};box.append(form)}else p.opts.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>check(i===p.correct);box.append(b)})}draw();
}else if(game==='dinero'){
 let initial=300000000000,balance=initial;const items=[['🍔 Hamburguesa',8],['🎮 Videojuego',60],['📱 Teléfono',1000],['🚲 Bicicleta',800],['🚗 Coche',40000],['🏠 Casa',500000],['🚁 Helicóptero',3000000],['🏝️ Isla',20000000],['🛩️ Jet privado',75000000],['🚀 Cohete',200000000],['⚽ Club de fútbol',1000000000]];let qty=items.map(()=>0);const money=n=>'$'+n.toLocaleString('es-ES');function draw(){a.innerHTML='<h1>💸 Gasta la fortuna</h1><p>Una versión alternativa para jugar a gastar una fortuna ficticia.</p><div id="balance"></div><div class="grid" id="items"></div><h2>Tu compra</h2><div id="receipt"></div><button id="reset">Empezar de nuevo</button>';document.getElementById('balance').textContent='Te quedan '+money(balance);items.forEach(([name,price],i)=>{let card=document.createElement('div');card.className='card';let title=document.createElement('strong');title.textContent=name;let cost=document.createElement('p');cost.textContent=money(price)+' · Cantidad: '+qty[i];let buy=document.createElement('button');buy.textContent='Comprar';buy.disabled=price>balance;buy.onclick=()=>{balance-=price;qty[i]++;draw()};let sell=document.createElement('button');sell.textContent='Vender';sell.disabled=!qty[i];sell.onclick=()=>{balance+=price;qty[i]--;draw()};card.append(title,cost,buy,sell);document.getElementById('items').append(card)});document.getElementById('receipt').textContent=qty.some(Boolean)?items.filter((x,i)=>qty[i]).map((x)=>{let i=items.indexOf(x);return x[0]+' × '+qty[i]}).join(' · ')+' | Total: '+money(initial-balance):'Aún no has comprado nada.';document.getElementById('reset').onclick=()=>{balance=initial;qty=items.map(()=>0);draw()}}draw();
}else if(game==='circulo'){
 a.innerHTML='<h1>⭕ Dibuja un círculo</h1><p>Dibuja un círculo de un solo trazo con el ratón o el dedo.</p><canvas id="c" width="500" height="400"></canvas><p id="message" role="status">¡A dibujar!</p><button id="reset">Intentar de nuevo</button>';const c=document.getElementById('c'),ctx=c.getContext('2d');let points=[],drawing=false;function clear(){ctx.clearRect(0,0,c.width,c.height);points=[];document.getElementById('message').textContent='¡A dibujar!'}function pos(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{clear();drawing=true;c.setPointerCapture(e.pointerId);points.push(pos(e));ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#12888b'};c.onpointermove=e=>{if(!drawing)return;let p=pos(e);points.push(p);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>{if(!drawing)return;drawing=false;if(points.length<3){document.getElementById('message').textContent='Trazo demasiado corto. Inténtalo otra vez.';return}let perimeter=0,area=0;for(let i=0;i<points.length;i++){let p=points[i],q=points[(i+1)%points.length];perimeter+=Math.hypot(q.x-p.x,q.y-p.y);area+=p.x*q.y-q.x*p.y}area=Math.abs(area)/2;let closure=Math.hypot(points[0].x-points.at(-1).x,points[0].y-points.at(-1).y),diameter=perimeter/Math.PI,circularity=4*Math.PI*area/(perimeter*perimeter),score=Math.max(0,Math.min(100,(circularity-.70)/.30*100-closure/diameter*120));document.getElementById('message').textContent=diameter<30?'Haz un círculo más grande.':'Tu círculo: '+score.toFixed(1)+' % (estimación)'};document.getElementById('reset').onclick=clear;
}else a.innerHTML='<h1>Juego no encontrado</h1>';
</script></body></html>
