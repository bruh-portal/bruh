<!doctype html>
  <meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
<title>DMF local key derivation</title>
<form id="f"><label>Password <input id="p" type="password" autocomplete="off" required></label><button>Derive</button></form>
<pre id="out"></pre>
<script>
'use strict';
const f=document.getElementById('f'), p=document.getElementById('p'), out=document.getElementById('out');
f.addEventListener('submit',async e=>{e.preventDefault(); const password=p.value;p.value=''; const salt=crypto.getRandomValues(new Uint8Array(16)); const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']); const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},key,256); const b64=b=>btoa(String.fromCharCode(...b)); out.textContent='SALT='+b64(salt)+'\nHASH='+b64(new Uint8Array(bits));});
</script>
