<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19"><title>Deportes · DMF</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#f2f6ff;font:16px/1.45 system-ui,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:16px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}.head h1{font-size:clamp(22px,4vw,32px);margin:0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #334d6b;border-radius:10px;background:#142238;color:#eef5ff;font:inherit;font-weight:700;padding:11px 16px;cursor:pointer}.tabs button[aria-selected=true]{background:#17607a;border-color:#42d9e8}.tabs button:focus-visible{outline:3px solid #ffda77}.info{color:#afc1d7;margin:4px 0 12px}.view{display:none}.view.active{display:block}.frame{width:100%;height:calc(100vh - 166px);min-height:570px;border:0;border-radius:12px;background:#fff;display:block}@media(max-width:650px){.wrap{padding:10px}.head{align-items:flex-start}.tabs{width:100%}.tabs button{flex:1}.frame{height:calc(100vh - 200px);min-height:520px}}
</style></head><body><main class="wrap"><header class="head"><h1>🏟️ Deportes</h1><nav class="tabs" role="tablist" aria-label="Vistas deportivas"><button type="button" role="tab" aria-selected="true" aria-controls="dmf-view" id="tab-dmf">DMF SPORTS</button><button type="button" role="tab" aria-selected="false" aria-controls="rfaf-view" id="tab-rfaf">Universo RFAF</button></nav></header><p class="info" id="view-info" aria-live="polite">Partidos, competiciones y resultados. La navegación permanece dentro de esta sección de DMF.</p><section class="view active" id="dmf-view" role="tabpanel" aria-labelledby="tab-dmf"><iframe class="frame" title="DMF SPORTS · partidos y competiciones" src="https://bruh-portal.github.io/sports/" loading="eager" allow="fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></section><section class="view" id="rfaf-view" role="tabpanel" aria-labelledby="tab-rfaf" hidden><iframe class="frame" title="Universo RFAF · delegaciones, competiciones y grupos" src="https://www.universorfaf.es/" loading="lazy" sandbox="allow-scripts allow-forms allow-same-origin allow-downloads" allow="fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></section></main><script>(()=>{const buttons=[...document.querySelectorAll('[role=tab]')],views=[...document.querySelectorAll('[role=tabpanel]')],info=document.querySelector('#view-info');function show(i){buttons.forEach((b,n)=>{b.setAttribute('aria-selected',String(i===n));b.tabIndex=i===n?0:-1});views.forEach((v,n)=>{v.classList.toggle('active',i===n);v.hidden=i!==n});info.textContent=i===0?'Partidos, competiciones y resultados. La navegación permanece dentro de esta sección de DMF.':'Portal oficial de la Federación Andaluza: delegaciones, competiciones y grupos.';buttons[i].focus()}buttons.forEach((b,i)=>b.addEventListener('click',()=>show(i)));buttons.forEach((b,i)=>b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show((i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length)}}))})();</script></body></html>
