<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19"><title>Deportes · DMF</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#f2f6ff;font:16px/1.45 system-ui,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:16px}.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}.head h1{font-size:clamp(22px,4vw,32px);margin:0}.search-area{display:flex;gap:8px;flex:1;min-width:min(100%,330px)}.search-area input{flex:1;min-width:0;border:1px solid #38516d;border-radius:10px;background:#111e30;color:#fff;font:inherit;padding:12px 14px}.search-area input:focus{outline:3px solid #42d9e8}.search-area button,.back{border:1px solid #334d6b;border-radius:10px;background:#17607a;color:#eef5ff;font:inherit;font-weight:700;padding:11px 16px;cursor:pointer}.search-area button:hover,.back:hover,.result:hover{border-color:#42d9e8;background:#1a536c}.hint,.status{color:#afc1d7;margin:4px 0 12px}.results{display:none;gap:10px;flex-wrap:wrap;margin:10px 0 14px}.results.visible{display:flex}.result{flex:1 1 220px;text-align:left;border:1px solid #334d6b;border-radius:12px;background:#142238;color:#f2f6ff;padding:14px;cursor:pointer;font:inherit}.result strong{display:block;font-size:17px;margin-bottom:4px}.result span{color:#afc1d7;font-size:14px}.result:focus-visible,.back:focus-visible{outline:3px solid #ffda77}.status:empty{display:none}.frame{width:100%;height:calc(100vh - 216px);min-height:570px;border:0;border-radius:12px;background:#fff;display:block}.view-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}.view-title h2{font-size:18px;margin:0}.back{display:none;padding:8px 12px}.back.visible{display:inline-block}@media(max-width:650px){.wrap{padding:10px}.head{align-items:flex-start}.search-area{width:100%;flex-basis:100%}.search-area button{padding:10px}.frame{height:calc(100vh - 255px);min-height:520px}.result{flex-basis:100%}}
</style></head><body><main class="wrap"><header class="head"><h1>🏟️ Deportes</h1><form class="search-area" id="search-form" role="search"><input id="search" type="search" placeholder="Buscar competiciones… prueba «RFAF»" aria-label="Buscar en Deportes" autocomplete="off"><button type="submit">Buscar</button></form></header><p class="hint" id="hint">Partidos y competiciones en DMF SPORTS. Busca «RFAF» para ver las fuentes andaluzas.</p><div class="results" id="results" aria-label="Resultados de búsqueda" aria-live="polite"><button type="button" class="result" data-source="rfaf"><strong>⚽ Universo RFAF</strong><span>Web oficial: partidos, delegaciones, competiciones y grupos.</span></button><button type="button" class="result" data-source="preferente"><strong>📋 La Preferente</strong><span>Abre la portada de Andalucía para elegir competición y consultar resultados actuales disponibles.</span></button><button type="button" class="result" data-source="login"><strong>🔐 Iniciar sesión · Universo RFAF</strong><span>Accede al inicio de sesión de Universo RFAF dentro de Deportes.</span></button></div><p class="status" id="status" role="status" aria-live="polite"></p><div class="view-title"><h2 id="frame-title">DMF SPORTS</h2><button type="button" class="back" id="back">← Volver a DMF SPORTS</button></div><iframe class="frame" id="sports-frame" title="DMF SPORTS · partidos y competiciones" src="https://bruh-portal.github.io/sports/" loading="eager" allow="fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></main>
<script>(()=>{const form=document.querySelector('#search-form'),input=document.querySelector('#search'),results=document.querySelector('#results'),frame=document.querySelector('#sports-frame'),title=document.querySelector('#frame-title'),status=document.querySelector('#status'),hint=document.querySelector('#hint'),back=document.querySelector('#back');const sources={rfaf:{url:'https://www.universorfaf.es/',title:'Universo RFAF',msg:'Web oficial de RFAF. Si algún enlace interno está limitado por su proveedor, vuelve aquí desde la búsqueda.'},preferente:{url:'https://www.lapreferente.com/',title:'La Preferente · Andalucía',msg:'La Preferente muestra filtros para comunidad, categoría y competición en su propia portada. Selecciona Andalucía y la competición que quieras consultar; no se carga un widget antiguo ni una temporada histórica.'},login:{url:'https://www.universorfaf.es/login',title:'Iniciar sesión · Universo RFAF',msg:'Inicio de sesión oficial de Universo RFAF.'}};function search(){const match=/rfaf/i.test(input.value);results.classList.toggle('visible',match);if(match){hint.textContent='Resultados para RFAF. Elige una fuente para cargarla en este mismo marco.';status.textContent=''}else{hint.textContent='Partidos y competiciones en DMF SPORTS. Busca «RFAF» para ver las fuentes andaluzas.';if(input.value.trim())status.textContent='No hay resultados para esa búsqueda. Prueba «RFAF».';else status.textContent=''}}form.addEventListener('submit',e=>{e.preventDefault();search()});input.addEventListener('input',search);results.querySelectorAll('[data-source]').forEach(button=>button.addEventListener('click',()=>{const source=sources[button.dataset.source];frame.title=source.title;frame.src=source.url;title.textContent=source.title;status.textContent=source.msg;back.classList.add('visible');frame.scrollIntoView({behavior:'smooth',block:'start'})}));back.addEventListener('click',()=>{frame.title='DMF SPORTS · partidos y competiciones';frame.src='https://bruh-portal.github.io/sports/';title.textContent='DMF SPORTS';status.textContent='';back.classList.remove('visible')});})();</script></body></html>
